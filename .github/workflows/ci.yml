name: CI

# Pull-request validation: catches broken Dart and broken Android builds before
# anything reaches main. Release signing is never involved here.
#
# `.github/**` rather than naming this file and the shared action, because the
# narrower list was a trap: a commit that changed only `release.yml` or
# `auto-release.yml` matched nothing, so no CI run happened — and
# auto-release.yml is triggered by *this* workflow succeeding. A change to the
# release pipeline was therefore the one kind of change that could not be
# validated by it, and got through unvalidated for exactly that reason. Every
# file that decides what ships is now covered by the check that gates shipping.
on:
  pull_request:
    branches: [main]
    paths:
      - 'duka_pos_app/**'
      - '.github/**'
  push:
    branches: [main]
    paths:
      - 'duka_pos_app/**'
      - '.github/**'
  workflow_dispatch:

# Cancel superseded runs so a rapid push-to-PR sequence does not burn minutes
# of runner time on commits that are already obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Analyze, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: duka_pos_app

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter and Android SDK
        uses: ./.github/actions/setup-flutter-android

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

      # A debug APK build exercises the part of the pipeline that analyze and
      # test cannot see: the Gradle configuration, AGP/manifest wiring, and the
      # native toolchain. Release builds require the signing keystore, which is
      # intentionally absent from this secret-free validation job — signing only
      # happens in release.yml during a tag-triggered release — so debug is the
      # variant that verifies the Android toolchain here.
      - name: Build debug APK (verifies the Android build still configures)
        run: flutter build apk --debug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: duka-pos-debug-apk
          path: duka_pos_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
