name: CI

# Pull-request validation: catches broken Dart and broken Android builds before
# anything reaches main. When the signing secret is available (pushes to main and
# same-repo PRs) it also produces a signed release APK as an artifact; fork PRs
# cannot read secrets and fall back to analyze + test only.
#
# `.github/**` rather than naming this file and the shared action, because the
# narrower list was a trap: a commit that changed only `release.yml` or
# `auto-release.yml` matched nothing, so no CI run happened — and
# auto-release.yml is triggered by *this* workflow succeeding. A change to the
# release pipeline was therefore the one kind of change that could not be
# validated by it, and got through unvalidated for exactly that reason. Every
# file that decides what ships is now covered by the check that gates shipping.
on:
  pull_request:
    branches: [main]
    paths:
      - 'duka_pos_app/**'
      - 'duka_pos_backend/**'
      - '.github/**'
  push:
    branches: [main]
    paths:
      - 'duka_pos_app/**'
      - 'duka_pos_backend/**'
      - '.github/**'
  workflow_dispatch:
    inputs:
      full_suite:
        description: 'Run every Flutter test file in one serial process to detect order-dependent failures'
        required: false
        type: boolean
        default: false

# Cancel superseded runs so a rapid push-to-PR sequence does not burn minutes
# of runner time on commits that are already obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend Compose stack and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Start the complete local backend stack
        working-directory: duka_pos_backend
        run: docker compose up --build -d

      - name: Verify Compose services are healthy
        shell: bash
        run: |
          set -Eeuo pipefail
          cleanup() {
            local status=$?
            docker compose -f duka_pos_backend/docker-compose.yml logs --no-color > /tmp/duka-pos-compose.log 2>&1 || true
            docker compose -f duka_pos_backend/docker-compose.yml down -v || true
            return "${status}"
          }
          trap cleanup EXIT INT TERM
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3100/ready >/dev/null; then break; fi
            if [[ "${attempt}" == 60 ]]; then
              docker compose -f duka_pos_backend/docker-compose.yml ps -a
              cat /tmp/duka-pos-compose.log 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done

      - name: Run backend unit and live integration tests inside Compose
        working-directory: duka_pos_backend
        run: >-
          docker compose --profile verify run --rm tests sh -lc
          'npm test && BASE_URL=http://backend:3000 npm run test:live &&
          BASE_URL=http://backend:3000 AUTH_TEST_CODE=123456 npm run test:live:auth &&
          BASE_URL=http://backend:3000 AUTH_TEST_CODE=123456 npm run test:live:analytics &&
          BASE_URL=http://backend:3000 AUTH_TEST_CODE=123456 npm run test:live:backup &&
          BASE_URL=http://backend:3000 AUTH_TEST_CODE=123456 CONCURRENCY=10 REQUESTS=50 npm run test:load &&
          npx --yes newman@latest run postman/duka-pos-live-smoke.postman_collection.json --env-var base_url=http://backend:3000 &&
          npx --yes newman@latest run postman/duka-pos-backend.postman_collection.json --env-var base_url=http://backend:3000 &&
          npx --yes newman@latest run postman/duka-pos-e2e.postman_collection.json --env-var base_url=http://backend:3000 --env-var verification_code=123456'

  validate:
    name: Analyze, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: duka_pos_app
    env:
      # Fork pull requests cannot read repository secrets, so on one they never
      # see a keystore here. Gate the release build on the secret's presence: a
      # fork PR still asserts that analyze + test pass, but skips signing and the
      # APK upload rather than failing the job over a missing secret. On pushes
      # to main and same-repo PRs the secret is present and the signed release
      # APK is built and uploaded below.
      BUILD_RELEASE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter and Android SDK
        uses: ./.github/actions/setup-flutter-android

      - name: Check for dependency upgrades
        run: |
          flutter pub upgrade --dry-run 2>&1 | tee /tmp/pub-upgrade.txt
          if grep -q "Changed [0-9]" /tmp/pub-upgrade.txt; then
            echo "::notice::Dependencies can be upgraded. Run 'flutter pub upgrade' locally and verify tests pass."
          else
            echo "All dependencies are up to date."
          fi

      - name: Validate localization catalogues
        run: python3 tool/l10n/check_arb.py

      - name: Analyze
        run: flutter analyze --fatal-infos

      # A release APK build exercises the part of the pipeline that analyze and
      # test cannot see: the Gradle configuration, AGP/manifest wiring, and the
      # native toolchain. Unlike a debug build it is *signed*, so the release
      # keystore is reconstructed only inside this ephemeral runner from the same
      # secret release.yml uses (rebuilt, used, and deleted before the job ends).
      # The signing steps only run when BUILD_RELEASE is true (see the env guard
      # above), so a fork PR that cannot supply the secret is not failed here.
      - name: Reconstruct the release keystore
        if: ${{ env.BUILD_RELEASE == 'true' }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for var in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS; do
            if [ -z "${!var}" ]; then
              echo "::error::Secret ${var} is not set. Add it under Settings > Secrets and variables > Actions."
              exit 1
            fi
          done

          # KEY_PASSWORD is optional and deliberately so. A keystore made with a
          # plain `keytool -genkeypair` and no -keypass shares one password between
          # the store and the key, and this project's key.properties has no
          # keyPassword entry at all. When it is supplied it wins.
          KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"

          echo "$KEYSTORE_BASE64" | base64 --decode > "android/duka-pos-release.jks"

          # Fail here rather than deep inside Gradle if the secret is corrupt or
          # the passwords are wrong — the message is otherwise very opaque.
          keytool -list -keystore "android/duka-pos-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null

          # Consumed by android/app/build.gradle.kts. storeFile is written as an
          # absolute path because it is resolved with Project.file() from the
          # :app module directory, and the workspace path is not known until run
          # time. The file is gitignored, so it never enters the repository.
          cat > android/key.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/duka_pos_app/android/duka-pos-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 android/key.properties

      - name: Build release APK
        if: ${{ env.BUILD_RELEASE == 'true' }}
        run: flutter build apk --release

      # The version this build carries, read from the same place Flutter reads
      # it. It labels the artefact below, because an APK that reports
      # versionCode 26 is not interchangeable with one that reports 27, and an
      # unlabelled `duka-pos-release-apk` in a run list says neither. The
      # release workflow publishes the same version as `duka-pos-<tag>-apk`,
      # so the two names together say which build is which.
      - name: Read the declared version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          line="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          if [ -z "$line" ]; then
            echo "::error::Could not read 'version:' from pubspec.yaml."
            exit 1
          fi
          echo "version=v${line}" >> "$GITHUB_OUTPUT"
          echo "This build carries ${line}."

      - name: Upload release APK artifact
        if: ${{ env.BUILD_RELEASE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          # `ci` in the name, because this is not the published artefact. It is
          # the same signed build of the same version, but built without the
          # release dart-defines (no BACKEND_URL, no OIDC_ISSUER_URL), so it is
          # an offline-only APK. The published one is the release workflow's
          # `duka-pos-<tag>-apk`, and it is wired.
          name: duka-pos-ci-${{ steps.version.outputs.version }}-apk
          path: duka_pos_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # Scrub signing material from the runner even if the build above failed,
      # so a keystore never outlives the job that reconstructed it.
      - name: Remove signing material from the workspace
        if: always()
        shell: bash
        run: |
          rm -f android/key.properties android/duka-pos-release.jks
          rm -f "$RUNNER_TEMP"/duka_pos_keystore.jks 2>/dev/null || true

  test:
    name: Flutter tests (shard ${{ matrix.shard }})
    needs: validate
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.full_suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Each shard has its own hosted runner and its own temporary cache. Keep
      # a small cap so four shards make progress without turning the shared
      # package/download service into the bottleneck.
      max-parallel: 3
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    defaults:
      run:
        working-directory: duka_pos_app
    env:
      # Do not let matrix jobs contend for a shared pub cache lock. The cache
      # action still restores dependencies, but Flutter resolves/writes into a
      # shard-local directory for the lifetime of this runner.
      PUB_CACHE: ${{ github.workspace }}/pub-cache-${{ matrix.shard }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter and Android SDK
        uses: ./.github/actions/setup-flutter-android

      - name: Run isolated serial shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          runner_pid=''
          cleanup() {
            local status=$?
            if [[ -n "${runner_pid}" ]]; then
              # Flutter starts tester/frontend children. Kill the whole
              # process group so cancellation cannot leave a tester behind.
              kill -TERM -- "-${runner_pid}" 2>/dev/null || true
              sleep 1
              kill -KILL -- "-${runner_pid}" 2>/dev/null || true
              wait "${runner_pid}" 2>/dev/null || true
            fi
            return "${status}"
          }
          trap cleanup EXIT INT TERM
          shard_count=6
          mapfile -t test_files < <(find test -type f -name '*_test.dart' | sort)
          files=()
          index=0
          for file in "${test_files[@]}"; do
            if (( index % shard_count == SHARD )); then
              files+=("$file")
            fi
            ((index += 1))
          done
          if (( ${#files[@]} == 0 )); then
            echo "No test files selected for shard ${SHARD}."
            exit 1
          fi
          # Each matrix job has its own runner, so Flutter's global startup
          # lock cannot serialize the shards. Keep each shard itself serial:
          # the test harness deliberately owns one shared SQLite/platform fake.
          setsid timeout --signal=TERM --kill-after=30s 25m \
            flutter test --concurrency=1 --exclude-tags=real-network --reporter expanded "${files[@]}" &
          runner_pid=$!
          if wait "${runner_pid}"; then
            test_status=0
          else
            test_status=$?
          fi
          runner_pid=''
          exit "${test_status}"

  full_suite:
    name: Flutter full suite (serial order check)
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        working-directory: duka_pos_app
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter and Android SDK
        uses: ./.github/actions/setup-flutter-android

      - name: Run full suite in one bounded serial process
        shell: bash
        run: |
          set -Eeuo pipefail
          runner_pid=''
          cleanup() {
            local status=$?
            if [[ -n "${runner_pid}" ]]; then
              kill -TERM -- "-${runner_pid}" 2>/dev/null || true
              sleep 1
              kill -KILL -- "-${runner_pid}" 2>/dev/null || true
              wait "${runner_pid}" 2>/dev/null || true
            fi
            return "${status}"
          }
          trap cleanup EXIT INT TERM
          mapfile -t test_files < <(find test -type f -name '*_test.dart' | sort)
          if (( ${#test_files[@]} == 0 )); then
            echo 'No Flutter test files found.'
            exit 1
          fi
          setsid timeout --signal=TERM --kill-after=30s 45m \
            flutter test --concurrency=1 --exclude-tags=real-network \
            --reporter expanded "${test_files[@]}" &
          runner_pid=$!
          if wait "${runner_pid}"; then
            test_status=0
          else
            test_status=$?
          fi
          runner_pid=''
          exit "${test_status}"
