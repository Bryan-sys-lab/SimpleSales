name: CI

# Pull-request validation: catches broken Dart and broken Android builds before
# anything reaches main. Release signing is never involved here.
#
# `.github/**` rather than naming this file and the shared action, because the
# narrower list was a trap: a commit that changed only `release.yml` or
# `auto-release.yml` matched nothing, so no CI run happened — and
# auto-release.yml is triggered by *this* workflow succeeding. A change to the
# release pipeline was therefore the one kind of change that could not be
# validated by it, and got through unvalidated for exactly that reason. Every
# file that decides what ships is now covered by the check that gates shipping.
on:
  pull_request:
    branches: [main]
    paths:
      - 'duka_pos_app/**'
      - '.github/**'
  push:
    branches: [main]
    paths:
      - 'duka_pos_app/**'
      - '.github/**'
  workflow_dispatch:

# Cancel superseded runs so a rapid push-to-PR sequence does not burn minutes
# of runner time on commits that are already obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Analyze, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: duka_pos_app

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter and Android SDK
        uses: ./.github/actions/setup-flutter-android

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

      # A release APK build exercises the part of the pipeline that analyze and
      # test cannot see: the Gradle configuration, AGP/manifest wiring, and the
      # native toolchain.
      - name: Build release APK
        run: flutter build apk --release

      - name: Build release app bundle
        run: flutter build appbundle --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: duka-pos-release-apk
          path: duka_pos_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: duka-pos-release-aab
          path: duka_pos_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  build-ios:
    name: Build iOS release app
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: duka_pos_app

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS release app
        run: flutter build ios --release --no-codesign

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: duka-pos-ios-release
          path: duka_pos_app/build/ios/Release-iphoneos/
          retention-days: 30
