name: Publish release to Nerva

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to publish (for example v2.0.0+32)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nerva-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish signed APK to Nerva
    needs: []
    uses: zxds1/nerva/.github/workflows/publish-release.yml@main
    with:
      product: bussiness-and-finance
      version: ${{ github.event.release.tag_name || inputs.tag }}
    secrets:
      CI_TOKEN: ${{ secrets.NERVA_CI_TOKEN }}
