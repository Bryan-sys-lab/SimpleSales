name: Build Cloudflare backend image

on:
  push:
    branches: [backend]

permissions:
  contents: write

concurrency:
  group: cloudflare-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out backend
        uses: actions/checkout@v4

      - name: Log in to Cloudflare Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cloudflare.com
          username: ${{ secrets.CLOUDFLARE_REGISTRY_USERNAME }}
          password: ${{ secrets.CLOUDFLARE_REGISTRY_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: duka_pos_backend
          file: duka_pos_backend/Dockerfile
          push: true
          tags: registry.cloudflare.com/0d995e8087844342ed0da43d9ccd9993/duka-pos-backend:latest

      # Workers Builds watches this branch. It is updated only after the image
      # is available, so Cloudflare never races the remote image publication.
      - name: Publish deploy branch
        run: git push origin "HEAD:refs/heads/cloudflare-deploy"
