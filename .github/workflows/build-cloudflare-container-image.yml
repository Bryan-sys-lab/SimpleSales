name: Build Cloudflare backend image

on:
  workflow_run:
    workflows: [Backend CI]
    types: [completed]
    branches: [backend]

permissions:
  contents: write

concurrency:
  group: cloudflare-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'backend'
      }}
    steps:
      - name: Check out backend
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to Cloudflare Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cloudflare.com
          username: ${{ secrets.CLOUDFLARE_REGISTRY_USERNAME }}
          password: ${{ secrets.CLOUDFLARE_REGISTRY_PASSWORD }}

      - name: Build and push backend image (includes Keycloak)
        uses: docker/build-push-action@v6
        with:
          context: duka_pos_backend
          file: duka_pos_backend/Dockerfile
          push: true
          tags: registry.cloudflare.com/0d995e8087844342ed0da43d9ccd9993/duka-pos-backend:prod

      - name: Pin image digest for the Cloudflare deployment
        shell: bash
        run: |
          set -euo pipefail
          backend_image="$(docker image inspect --format '{{index .RepoDigests 0}}' registry.cloudflare.com/0d995e8087844342ed0da43d9ccd9993/duka-pos-backend:prod)"
          BACKEND_IMAGE="$backend_image" node <<'NODE'
          const fs = require('node:fs');
          const file = 'duka_pos_backend/cloudflare/wrangler.jsonc';
          const source = fs.readFileSync(file, 'utf8');
          fs.writeFileSync(file, source.replaceAll('__BACKEND_IMAGE__', process.env.BACKEND_IMAGE));
          NODE

      - name: Commit deployment image digest
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add duka_pos_backend/cloudflare/wrangler.jsonc
          git commit -m "ci: pin Cloudflare container image digest"

      # Workers Builds watches this branch. It is updated only after the image
      # is available, so Cloudflare never races the remote image publication.
      - name: Publish deploy branch
        # This is a generated deployment ref, not a development branch; replace
        # its previous digest-pinned commit on every backend image publication.
        run: git push --force origin "HEAD:refs/heads/cloudflare-deploy"
