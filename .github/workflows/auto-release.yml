name: Auto release

# Tags a release once CI is green on main. It does not build anything.
#
# The build, signing, verification and publication all stay in `release.yml`,
# which can still be driven by hand with a tag. This workflow only automates the
# decision to *make* a tag, which keeps the irreversible part of a release —
# signing a real key and publishing a public artefact — in one reviewed, gated
# place rather than duplicating it.
#
# Having made the tag, it dispatches `release.yml` directly rather than leaving
# the tag push to trigger it. A tag push is not a contract here: every tag from
# v2.0.0+2 to +20 was pushed and Release never ran once for any of them, so each
# of those commits was released in name only. See the dispatch step below.
#
# Why this cannot run away:
#
#   Every version this workflow produces is copied out of pubspec.yaml, and it
#   commits nothing. No commit means no new push to main, which means no new
#   green CI run, which means no new auto-release. The loop that a "bump
#   pubspec, commit, release" design walks straight into has nothing to grip
#   here.
#
#   Two further guards, because "cannot loop" is not the same to "cannot
#   repeat": a tag already pointing at this commit ends the run, and the release
#   is a draft until it has built and verified successfully.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [app]

# Serialise: two green runs finishing together must not both read the same
# highest released build number and mint the same one.
concurrency:
  group: auto-release-app
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    name: Tag the release for this commit
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    # Deliberately no job-level `defaults.run.working-directory`, even though
    # pubspec.yaml lives in duka_pos_app/ rather than at the root.
    #
    # Setting it fixes the read and breaks the job, because the working directory
    # applies to *every* `run:` step including the ones before `actions/checkout`
    # has created the repository. The first live run did exactly that: the
    # workflow failed in its opening step — a block of `echo` lines — with the
    # directory not found, having never reached the read it was meant to fix.
    #
    # So the one step that needs the subdirectory names the file outright. A
    # single explicit path is also easier to keep correct than a cwd every step
    # silently depends on.
    steps:
      - name: Explain what is about to happen
        run: |
          echo "CI run ${{ github.event.workflow_run.id }} concluded:"
          echo "  conclusion : ${{ github.event.workflow_run.conclusion }}"
          echo "  event      : ${{ github.event.workflow_run.event }}"
          echo "  branch     : ${{ github.event.workflow_run.head_branch }}"
          echo "  commit     : ${{ github.event.workflow_run.head_sha }}"
          echo "  url        : ${{ github.event.workflow_run.html_url }}"

      # `actions/checkout` defaults to the default branch at *this* run's ref,
      # and on a `workflow_run` trigger GITHUB_SHA is the default branch's head —
      # which is not necessarily the commit that was just tested. The tested
      # commit is head_sha on the event payload, and tagging anything else would
      # release code that never passed CI.
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Compute the release tag
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ github.event.workflow_run.head_sha }}"
          branch="${{ github.event.workflow_run.head_branch }}"

          # Belt and braces. `branches: [main]` above already filters on the
          # head branch, so a pull request's run should never arrive here — but
          # a release is irreversible and this workflow holds signing-triggering
          # permission, so the check is repeated rather than assumed.
          if [ "$branch" != "app" ]; then
            echo "::error::Refusing to release: tested branch is '${branch}', not main."
            exit 1
          fi

          # The version is read from pubspec exactly as a human left it. This
          # workflow does not decide that a commit is a new product version; it
          # only decides which build of the version the human already declared to
          # publish next.
          # duka_pos_app/ spelled out because this job runs at the repository
          # root — see the note on working-directory above.
          line="$(awk '/^version:/{print $2; exit}' duka_pos_app/pubspec.yaml)"
          if [ -z "$line" ]; then
            echo "::error::Could not read 'version:' from pubspec.yaml."
            exit 1
          fi
          semver="${line%%+*}"
          declared="${line##*+}"

          if ! [[ "$semver" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::pubspec version '${line}' is not a recognisable semver."
            exit 1
          fi
          if ! [[ "$declared" =~ ^[0-9]+$ ]]; then
            echo "::error::pubspec build number '${declared}' is not a positive integer."
            exit 1
          fi
          echo "pubspec declares ${semver}+${declared}"

          # THE TAG IS EXACTLY WHAT pubspec DECLARES.
          #
          # Flutter reads the Android versionCode out of pubspec
          # (android/app/build.gradle.kts: `versionCode = flutter.versionCode`),
          # so an APK built from this commit can only ever carry build
          # ${declared}. A tag naming any other build number describes an APK
          # that no build of this commit can produce.
          #
          # This step used to derive the build number from release history
          # instead — `next = highest + 1` — which is how v2.0.0+27 came to be
          # tagged on a commit whose pubspec said 2.0.0+26. The tag said 27, the
          # APK said 26, and release.yml failed on "APK versionCode '26' does
          # not match the tag's build number '27'" after spending ten minutes
          # building it. The gap between "the number the tag names" and "the
          # number the build produces" is the whole bug, and it can only be
          # closed by taking the number from the one place the build reads it.
          #
          # The build number still has to be monotonic, and that is enforced
          # below — by refusing, loudly, to reuse one. It is not enforced by
          # inventing a different one.
          tag="v${semver}+${declared}"

          # One tag per commit. If this commit is already tagged with exactly
          # this version, the release for it exists or is in flight and there is
          # nothing to do. This is what makes a re-run of the whole pipeline
          # idempotent.
          # `git tag --points-at`, and only that.
          #
          # An earlier version of this also tried
          #   git rev-parse -q --verify "refs/tags/v${semver}+*"
          # which looks like it asks whether any build of this version has been
          # tagged. It never matches: --verify requires an exact ref name and
          # does not glob, so the condition was always false. A guard that reads
          # like a guard and silently never fires is worse than none, because it
          # is the reason somebody believes re-runs are safe.
          existing="$(git tag --points-at "$sha" | tr '\n' ' ')"
          if [ -n "$existing" ]; then
            if printf '%s\n' $existing | grep -qxF "$tag"; then
              echo "::notice::Commit ${sha} is already tagged (${tag}). Nothing to release."
              echo "::notice::If that tag's release failed, re-run it with:"
              echo "::notice::  gh workflow run release.yml --ref ${tag}"
              echo "already_tagged=true" >> "$GITHUB_OUTPUT"
              echo "tag=${tag}" >> "$GITHUB_OUTPUT"
              echo "semver=${semver}" >> "$GITHUB_OUTPUT"
              echo "code=${declared}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # The commit carries a tag that does not match pubspec. This is
            # the shape of the v2.0.0+27 failure, caught before a tag is
            # minted rather than after an APK is built.
            echo "::error::Commit ${sha} is already tagged (${existing% }) but pubspec declares ${semver}+${declared}."
            echo "::error::The APK built from this commit would carry versionCode ${declared}, so it can never be the release named by that tag."
            echo "::error::Bump the build number in duka_pos_app/pubspec.yaml to match the tag, or release from a commit with no tag."
            exit 1
          fi

          # A build number is spent once. Android refuses to install over an
          # equal or lower versionCode, so reusing a number is not a cosmetic
          # problem: it produces an APK that silently will not update a till.
          #
          # Tags are the source of truth rather than published releases: a tag
          # survives a failed or abandoned release, which is exactly when a
          # number must not be reused. A release list would let a failed
          # release's number be handed out again, and the handset that
          # installed the failed build would refuse the replacement.
          highest=0
          for t in $(git tag --list "v${semver}+*"); do
            code="${t##*+}"
            if [[ "$code" =~ ^[0-9]+$ ]] && [ "$code" -gt "$highest" ]; then
              highest="$code"
            fi
          done
          # `gh release list` needs a token of its own; GITHUB_TOKEN is the
          # workflow's own and carries the `contents: write` this workflow
          # already declares. Without it the command fails and the release
          # history contributes nothing to `highest`.
          for release in $(GH_TOKEN="${{ github.token }}" gh release list --limit 200 --json tagName --jq '.[].tagName' 2>/dev/null || true); do
            case "$release" in
              v${semver}+*)
                code="${release##*+}"
                if [[ "$code" =~ ^[0-9]+$ ]] && [ "$code" -gt "$highest" ]; then
                  highest="$code"
                fi
                ;;
            esac
          done

          # THE NUMBER IN PUBSPEC IS SPENT. BUMP IT AND CARRY ON.
          #
          # It used to fail here, and it failed every single time: the build
          # number in pubspec is the number the last release consumed, so the
          # commit AFTER a release always found its own number already used
          # and every release needed a human to remember to bump it. A release
          # pipeline that needs remembering is a release pipeline that is
          # sometimes skipped, and a skipped release is a till that does not
          # get the fix.
          #
          # So the pipeline bumps it itself. The next free number is
          # ${highest}+1, and the commit that carries it is the commit that
          # gets released — the tested commit plus a version bump, which is
          # exactly the change that has to be in a release anyway.
          #
          # The bump is a real commit on main, so the repository always says
          # what was released. The APK is built from that commit and therefore
          # carries its number, so the tag and the APK cannot disagree — which
          # is the bug that spent 27 in the first place.
          if [ "$declared" -le "$highest" ]; then
            next=$(( highest + 1 ))
            echo "::notice::Build ${declared} of ${semver} was already released. Bumping to ${next}."
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "next=${next}" >> "$GITHUB_OUTPUT"
            echo "sha=${sha}" >> "$GITHUB_OUTPUT"
            echo "tag=v${semver}+${next}" >> "$GITHUB_OUTPUT"
            echo "semver=${semver}" >> "$GITHUB_OUTPUT"
            echo "code=${next}" >> "$GITHUB_OUTPUT"
            echo "already_tagged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "highest used build for ${semver}: ${highest}"
          echo "release tag: ${tag}"
          echo "stale=false" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "semver=${semver}" >> "$GITHUB_OUTPUT"
          echo "code=${declared}" >> "$GITHUB_OUTPUT"
          echo "already_tagged=false" >> "$GITHUB_OUTPUT"

      # THE BUMP: one commit, one line, on top of the tested commit.
      #
      # It has to be pushed with the PAT, like the tag. A push made with the
      # default GITHUB_TOKEN does not start a workflow run, and this push has
      # to start one: the release is built from the commit this produces, and
      # the CI that blesses it is what stands behind it.
      #
      # It is pushed on top of the TESTED commit, not on top of main's head.
      # Main's head may have moved since the CI run, and those commits have
      # not been through CI — releasing them would release code nobody
      # tested. If main HAS moved, this push is rejected as a
      # non-fast-forward, and that is not a failure: the run for the newer
      # commit is already queued and will do the same bump on top of itself.
      - name: Bump the build number
        id: bump
        if: steps.plan.outputs.stale == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret RELEASE_TAG_TOKEN is not set."
            echo "::error::The bump has to be pushed by a credential GitHub will run workflows for."
            echo "::error::The automatic GITHUB_TOKEN cannot be used: GitHub does not start a workflow"
            echo "::error::for a push made with it, so the commit that carries the build number"
            echo "::error::would never be CI'd, and the release would ship an untested commit."
            exit 1
          fi

          semver="${{ steps.plan.outputs.semver }}"
          next="${{ steps.plan.outputs.next }}"

          # The version line, and only the version line. `sed` on the exact
          # `version:` key rather than on the first number in the file, so a
          # version elsewhere in the pubspec cannot be rewritten by accident.
          sed -i "s|^version: ${semver}+[0-9]*$|version: ${semver}+${next}|" duka_pos_app/pubspec.yaml

          bumped="$(awk '/^version:/{print $2; exit}' duka_pos_app/pubspec.yaml)"
          if [ "$bumped" != "${semver}+${next}" ]; then
            echo "::error::Could not bump the build number: pubspec now says '${bumped}', expected '${semver}+${next}'."
            exit 1
          fi
          echo "pubspec now declares ${bumped}"

          # The commit needs an identity. `actions/checkout` leaves the
          # repository with none, and a commit without one is refused.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add duka_pos_app/pubspec.yaml
          # Two -m arguments rather than a multi-line string: a message
          # wrapped across lines inside a YAML block scalar is a YAML key, and
          # the YAML error is a long way from the shell error it causes.
          git commit -m "chore(release): bump the build number to ${next}" -m "The build number in pubspec is the number the last release consumed, so every commit after a release found its own number already used, and every release needed somebody to remember to bump it by hand. The pipeline does it now: the next free number is carried by a commit on top of the tested one, and that commit is what gets built and tagged, so the tag and the APK can never disagree."

          # The PAT in an extra header rather than in the remote URL: a URL
          # with the token in it is written to .git/config and can be read
          # off the machine by anything that can read the repository.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          if ! git -c http.extraheader="AUTHORIZATION: basic ${auth}" push origin HEAD:app; then
            # FAILED, not "nothing to do".
            #
            # The push is rejected when main has moved on since this run
            # started, and the run for that newer commit is already queued: it
            # will bump on top of itself and release that. So this run has
            # released nothing, and it says so by FAILING.
            #
            # It used to exit 0 here, which was the worst of both: a green run
            # that released nothing. The whole point of this workflow is that
            # a release is either there or announced, and "merely late" must
            # not look like "done".
            echo "::error::Could not push the build-number bump: main has moved on since this run started."
            echo "::error::This run released nothing. The run for the newer commit will bump and release it."
            echo "::error::Nothing was tagged, so no APK is in flight from here."
            exit 1
          fi

          echo "bumped=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "::notice::Bumped the build number to ${next} in $(git rev-parse --short HEAD)."

      # Pushed with a PAT, not the default GITHUB_TOKEN.
      #
      # GitHub does not start a workflow run for a push made with GITHUB_TOKEN —
      # the recursion guard, which exists so a workflow cannot trigger itself.
      # The consequence is specific and silent: auto-release.yml pushed v2.0.0+1,
      # the tag is on the remote, it matches release.yml's `v*` filter, and
      # release.yml never ran. The tag existed and nothing was released, and
      # nothing in the logs said why.
      #
      # A fine-grained PAT scoped to this repository with `contents: write` is
      # the documented way through it. There is deliberately no fallback to
      # GITHUB_TOKEN: that fallback *is* the bug, and it would fail the same way
      # while looking like it had worked.
      - name: Create and push the tag
        if: steps.plan.outputs.already_tagged == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret RELEASE_TAG_TOKEN is not set."
            echo "::error::The tag must be pushed by a credential GitHub will run workflows for."
            echo "::error::The automatic GITHUB_TOKEN cannot be used: GitHub does not start a workflow"
            echo "::error::for a push made with it, so release.yml would never fire."
            echo "::error::Create a fine-grained PAT scoped to this repository with 'Contents: write'"
            echo "::error::and add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          tag="${{ steps.plan.outputs.tag }}"
          # The commit that carries the version. Normally the tested one; after
          # a bump, the commit the bump produced — because THAT is the commit
          # whose pubspec declares the number, and the APK is built from it.
          sha="${{ steps.bump.outputs.bumped || steps.plan.outputs.sha }}"

          # Lightweight and local-only until the push succeeds: a tag object
          # created but never pushed is harmless, whereas a half-applied remote
          # ref is not something this job can inspect.
          git tag "$tag" "$sha"

          if ! git push origin "refs/tags/$tag"; then
            git tag -d "$tag" >/dev/null 2>&1 || true
            echo "::error::Could not push ${tag}. Another release job may have created it first."
            exit 1
          fi

          echo "Tagged ${tag} at ${sha}."
          echo "Dispatching the signed build for ${tag}."

      # Do not let the tag push be the trigger. GitHub declined to run
      # release.yml for every tag this workflow pushed from v2.0.0+2 to
      # v2.0.0+20, so each of those commits was tagged, given a release that
      # was never built, and quietly acquired no APK. The push event is not a
      # contract we can rely on here, so dispatch Release explicitly instead:
      # the API either accepts the call and a run exists, or gh fails and this
      # job fails with it. That is the difference between a release that is
      # merely late and one that is silently absent.
      - name: Dispatch the signed release build
        if: steps.plan.outputs.already_tagged == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.plan.outputs.tag }}"

          # The dispatch is accepted as soon as GitHub returns 204, which is
          # before the run is queryable, so a single poll would mostly test
          # GitHub's latency rather than our work.
          if ! gh workflow run release.yml --ref "$tag"; then
            echo "::error::Could not dispatch release.yml for ${tag}."
            echo "::error::RELEASE_TAG_TOKEN needs the 'Actions' permission set to write,"
            echo "::error::in addition to 'Contents' write for pushing the tag."
            echo "::error::The tag exists but nothing is building from it. Publish by hand with:"
            echo "::error::  gh workflow run release.yml --ref ${tag}"
            exit 1
          fi

          # Confirm a run actually exists, because the failure this replaces
          # was exactly a trigger that reported success and did nothing.
          for attempt in 1 2 3 4 5 6; do
            sleep 10
            run_id=$(gh run list --workflow release.yml --branch "$tag" \
                       --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
            if [ -n "$run_id" ]; then
              echo "release.yml is running for ${tag} (run ${run_id})."
              echo "It appears as a DRAFT until the signed APK has built and verified."
              exit 0
            fi
            echo "Waiting for the ${tag} release run to appear (attempt ${attempt}/6)."
          done

          echo "::error::Dispatched release.yml for ${tag} but no run appeared within a minute."
          echo "::error::Check the Actions tab, then publish by hand with:"
          echo "::error::  gh workflow run release.yml --ref ${tag}"
          exit 1

      - name: Summarise
        if: always()
        run: |
          if [ "${{ steps.plan.outputs.already_tagged }}" = "true" ]; then
            echo "Nothing to do: this commit was already released."
          elif [ "${{ steps.plan.outputs.stale }}" = "true" ]; then
            echo "Requested release ${{ steps.plan.outputs.tag }}."
            echo "The build number in pubspec was already used, so the pipeline bumped it"
            echo "to ${{ steps.plan.outputs.next }} in a commit of its own, and that commit is"
            echo "what is being built and tagged."
            echo "It appears as a DRAFT until the signed APK has built and verified."
          else
            echo "Requested release ${{ steps.plan.outputs.tag }}."
            echo "It appears as a DRAFT until the signed APK has built and verified."
          fi
