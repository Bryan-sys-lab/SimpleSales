name: Auto release

# Tags a release once CI is green on main. It does not build anything.
#
# The build, signing, verification and publication all stay in `release.yml`,
# which can still be driven by hand with a tag. This workflow only automates the
# decision to *make* a tag, which keeps the irreversible part of a release —
# signing a real key and publishing a public artefact — in one reviewed, gated
# place rather than duplicating it.
#
# Having made the tag, it dispatches `release.yml` directly rather than leaving
# the tag push to trigger it. A tag push is not a contract here: every tag from
# v2.0.0+2 to +20 was pushed and Release never ran once for any of them, so each
# of those commits was released in name only. See the dispatch step below.
#
# Why this cannot run away:
#
#   Every version this workflow produces is derived from what has already been
#   released, and it commits nothing. No commit means no new push to main, which
#   means no new green CI run, which means no new auto-release. The loop that a
#   "bump pubspec, commit, release" design walks straight into has nothing to
#   grip here.
#
#   Two further guards, because "cannot loop" is not the same as "cannot repeat":
#   a tag already pointing at this commit ends the run, and the release is a
#   draft until it has built and verified successfully.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Serialise: two green runs finishing together must not both read the same
# highest released build number and mint the same one.
concurrency:
  group: auto-release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    name: Tag the release for this commit
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    # Deliberately no job-level `defaults.run.working-directory`, even though
    # pubspec.yaml lives in duka_pos_app/ rather than at the root.
    #
    # Setting it fixes the read and breaks the job, because the working directory
    # applies to *every* `run:` step including the ones before `actions/checkout`
    # has created the repository. The first live run did exactly that: the
    # workflow failed in its opening step — a block of `echo` lines — with the
    # directory not found, having never reached the read it was meant to fix.
    #
    # So the one step that needs the subdirectory names the file outright. A
    # single explicit path is also easier to keep correct than a cwd every step
    # silently depends on.
    steps:
      - name: Explain what is about to happen
        run: |
          echo "CI run ${{ github.event.workflow_run.id }} concluded:"
          echo "  conclusion : ${{ github.event.workflow_run.conclusion }}"
          echo "  event      : ${{ github.event.workflow_run.event }}"
          echo "  branch     : ${{ github.event.workflow_run.head_branch }}"
          echo "  commit     : ${{ github.event.workflow_run.head_sha }}"
          echo "  url        : ${{ github.event.workflow_run.html_url }}"

      # `actions/checkout` defaults to the default branch at *this* run's ref,
      # and on a `workflow_run` trigger GITHUB_SHA is the default branch's head —
      # which is not necessarily the commit that was just tested. The tested
      # commit is head_sha on the event payload, and tagging anything else would
      # release code that never passed CI.
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Compute the release tag
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ github.event.workflow_run.head_sha }}"
          branch="${{ github.event.workflow_run.head_branch }}"

          # Belt and braces. `branches: [main]` above already filters on the
          # head branch, so a pull request's run should never arrive here — but
          # a release is irreversible and this workflow holds signing-triggering
          # permission, so the check is repeated rather than assumed.
          if [ "$branch" != "main" ]; then
            echo "::error::Refusing to release: tested branch is '${branch}', not main."
            exit 1
          fi

          # The version is read from pubspec exactly as a human left it. This
          # workflow does not decide that a commit is a new product version; it
          # only decides which build of the version the human already declared to
          # publish next.
          # duka_pos_app/ spelled out because this job runs at the repository
          # root — see the note on working-directory above.
          line="$(awk '/^version:/{print $2; exit}' duka_pos_app/pubspec.yaml)"
          if [ -z "$line" ]; then
            echo "::error::Could not read 'version:' from pubspec.yaml."
            exit 1
          fi
          semver="${line%%+*}"
          declared="${line##*+}"

          if ! [[ "$semver" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::pubspec version '${line}' is not a recognisable semver."
            exit 1
          fi
          if ! [[ "$declared" =~ ^[0-9]+$ ]]; then
            echo "::error::pubspec build number '${declared}' is not a positive integer."
            exit 1
          fi
          echo "pubspec declares ${semver}+${declared}"

          # One tag per commit. If this commit is already tagged, the release for
          # it exists or is in flight and there is nothing to do. This is what
          # makes a re-run of the whole pipeline idempotent.
          # `git tag --points-at`, and only that.
          #
          # An earlier version of this also tried
          #   git rev-parse -q --verify "refs/tags/v${semver}+*"
          # which looks like it asks whether any build of this version has been
          # tagged. It never matches: --verify requires an exact ref name and
          # does not glob, so the condition was always false. A guard that reads
          # like a guard and silently never fires is worse than none, because it
          # is the reason somebody believes re-runs are safe.
          if git tag --points-at "$sha" | grep -q .; then
            existing="$(git tag --points-at "$sha" | tr '\n' ' ')"
            echo "::notice::Commit ${sha} is already tagged (${existing}). Nothing to release."
            echo "already_tagged=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The build number comes from release history, not from pubspec, so it
          # is monotonic by construction. Android refuses to install over an
          # equal or lower versionCode, so reusing a number is not a cosmetic
          # problem: it produces an APK that silently will not update a till.
          highest=0
          for tag in $(git tag --list "v${semver}+*"); do
            code="${tag##*+}"
            if [[ "$code" =~ ^[0-9]+$ ]] && [ "$code" -gt "$highest" ]; then
              highest="$code"
            fi
          done
          # Tags are the source of truth rather than releases: a tag survives a
          # failed or abandoned release, which is exactly when a number must not
          # be reused.
          for release in $(gh release list --limit 200 --json tagName --jq '.[].tagName' 2>/dev/null || true); do
            case "$release" in
              v${semver}+*)
                code="${release##*+}"
                if [[ "$code" =~ ^[0-9]+$ ]] && [ "$code" -gt "$highest" ]; then
                  highest="$code"
                fi
                ;;
            esac
          done

          next=$(( highest + 1 ))
          # Never below the number pubspec already carries: a human who wrote
          # 2.0.0+7 means seven builds exist.
          if [ "$declared" -gt "$next" ]; then
            next="$declared"
          fi

          echo "highest released build for ${semver}: ${highest}"
          echo "next release tag: v${semver}+${next}"
          echo "tag=v${semver}+${next}" >> "$GITHUB_OUTPUT"
          echo "semver=${semver}" >> "$GITHUB_OUTPUT"
          echo "code=${next}" >> "$GITHUB_OUTPUT"
          echo "already_tagged=false" >> "$GITHUB_OUTPUT"

      # Pushed with a PAT, not the default GITHUB_TOKEN.
      #
      # GitHub does not start a workflow run for a push made with GITHUB_TOKEN —
      # the recursion guard, which exists so a workflow cannot trigger itself.
      # The consequence is specific and silent: auto-release.yml pushed v2.0.0+1,
      # the tag is on the remote, it matches release.yml's `v*` filter, and
      # release.yml never ran. The tag existed and nothing was released, and
      # nothing in the logs said why.
      #
      # A fine-grained PAT scoped to this repository with `contents: write` is
      # the documented way through it. There is deliberately no fallback to
      # GITHUB_TOKEN: that fallback *is* the bug, and it would fail the same way
      # while looking like it had worked.
      - name: Create and push the tag
        if: steps.plan.outputs.already_tagged == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret RELEASE_TAG_TOKEN is not set."
            echo "::error::The tag must be pushed by a credential GitHub will run workflows for."
            echo "::error::The automatic GITHUB_TOKEN cannot be used: GitHub does not start a workflow"
            echo "::error::for a push made with it, so release.yml would never fire."
            echo "::error::Create a fine-grained PAT scoped to this repository with 'Contents: write'"
            echo "::error::and add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          tag="${{ steps.plan.outputs.tag }}"
          sha="${{ github.event.workflow_run.head_sha }}"

          # Lightweight and local-only until the push succeeds: a tag object
          # created but never pushed is harmless, whereas a half-applied remote
          # ref is not something this job can inspect.
          git tag "$tag" "$sha"

          if ! git push origin "refs/tags/$tag"; then
            git tag -d "$tag" >/dev/null 2>&1 || true
            echo "::error::Could not push ${tag}. Another release job may have created it first."
            exit 1
          fi

          echo "Tagged ${tag} at ${sha}."
          echo "Dispatching the signed build for ${tag}."

      # Do not let the tag push be the trigger. GitHub declined to run
      # release.yml for every tag this workflow pushed from v2.0.0+2 to
      # v2.0.0+20, so each of those commits was tagged, given a release that
      # was never built, and quietly acquired no APK. The push event is not a
      # contract we can rely on here, so dispatch Release explicitly instead:
      # the API either accepts the call and a run exists, or gh fails and this
      # job fails with it. That is the difference between a release that is
      # merely late and one that is silently absent.
      - name: Dispatch the signed release build
        if: steps.plan.outputs.already_tagged == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.plan.outputs.tag }}"

          # The dispatch is accepted as soon as GitHub returns 204, which is
          # before the run is queryable, so a single poll would mostly test
          # GitHub's latency rather than our work.
          if ! gh workflow run release.yml --ref "$tag"; then
            echo "::error::Could not dispatch release.yml for ${tag}."
            echo "::error::RELEASE_TAG_TOKEN needs the 'Actions' permission set to write,"
            echo "::error::in addition to 'Contents' write for pushing the tag."
            echo "::error::The tag exists but nothing is building from it. Publish by hand with:"
            echo "::error::  gh workflow run release.yml --ref ${tag}"
            exit 1
          fi

          # Confirm a run actually exists, because the failure this replaces
          # was exactly a trigger that reported success and did nothing.
          for attempt in 1 2 3 4 5 6; do
            sleep 10
            run_id=$(gh run list --workflow release.yml --branch "$tag" \
                       --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
            if [ -n "$run_id" ]; then
              echo "release.yml is running for ${tag} (run ${run_id})."
              echo "It appears as a DRAFT until the signed APK has built and verified."
              exit 0
            fi
            echo "Waiting for the ${tag} release run to appear (attempt ${attempt}/6)."
          done

          echo "::error::Dispatched release.yml for ${tag} but no run appeared within a minute."
          echo "::error::Check the Actions tab, then publish by hand with:"
          echo "::error::  gh workflow run release.yml --ref ${tag}"
          exit 1

      - name: Summarise
        if: always()
        run: |
          if [ "${{ steps.plan.outputs.already_tagged }}" = "true" ]; then
            echo "Nothing to do: this commit was already released."
          else
            echo "Requested release ${{ steps.plan.outputs.tag }}."
            echo "It appears as a DRAFT until the signed APK has built and verified."
          fi