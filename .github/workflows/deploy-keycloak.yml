name: Deploy Keycloak Worker

on:
  workflow_run:
    workflows: [Backend CI]
    types: [completed]
    branches: [backend]
  workflow_dispatch:

concurrency:
  group: keycloak-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy reusable Keycloak container
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'backend')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: duka_pos_backend/cloudflare-keycloak
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out tested backend commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: duka_pos_backend/cloudflare-keycloak/package-lock.json

      - name: Install deployment dependencies
        run: npm ci

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::${name} is not configured in GitHub Actions secrets."
              exit 1
            fi
          done

      - name: Deploy Worker and container image
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Set Neon and Keycloak secrets
        shell: bash
        env:
          KC_DB_URL: ${{ secrets.KEYCLOAK_NEON_JDBC_URL }}
          KC_DB_USERNAME: ${{ secrets.KEYCLOAK_NEON_USERNAME }}
          KC_DB_PASSWORD: ${{ secrets.KEYCLOAK_NEON_PASSWORD }}
          KC_HOSTNAME: ${{ secrets.KEYCLOAK_HOSTNAME }}
          KEYCLOAK_ADMIN: ${{ secrets.KEYCLOAK_ADMIN }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
        run: |
          set -Eeuo pipefail
          names=(KC_DB_URL KC_DB_USERNAME KC_DB_PASSWORD KC_HOSTNAME KEYCLOAK_ADMIN KEYCLOAK_ADMIN_PASSWORD)
          for name in "${names[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::${name} is not configured as a GitHub Actions secret."
              exit 1
            fi
            printf '%s' "${!name}" | npx wrangler secret put "${name}" --config wrangler.jsonc
          done

      - name: Roll out the configured container
        run: npx wrangler deploy --config wrangler.jsonc
