name: Publish to Nerva

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish release to Nerva
        env:
          CI_TOKEN: ${{ secrets.NERVA_CI_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          version="${version#v}"
          apk_name="SimpleSales-${{ github.ref_name }}.apk"
          url="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${apk_name}"
          payload="$(jq -n \
            --arg id "bussiness-and-finance" \
            --arg version "$version" \
            --arg url "$url" \
            '{id: $id, version: {version: $version, url: $url, channel: "beta"}}')"
          curl -fSs -X POST https://nerva.brianbmk332.workers.dev/api/releases \
            -H "x-ci-token: $CI_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload"
          echo
