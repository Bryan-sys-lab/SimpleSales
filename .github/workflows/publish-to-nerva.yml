name: Publish to Nerva

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name || github.ref_name }}"
          gh release download "$tag" --repo "${{ github.repository }}" --pattern '*.apk' --dir build
          ls -lh build

      - name: Publish release to Nerva
        env:
          CI_TOKEN: ${{ secrets.NERVA_CI_TOKEN }}
        run: |
          set -euo pipefail
          APK=$(find build -name '*.apk' | head -n 1)
          test -n "$APK"
          tag="${{ github.event.release.tag_name || github.ref_name }}"
          version="${tag#v}"
          curl -fSs -X POST https://nerva.brianbmk332.workers.dev/api/releases \
            -H "x-ci-token: $CI_TOKEN" \
            -F "productId=bussiness-and-finance" \
            -F "version=${version}" \
            -F "channel=beta" \
            -F "file=@$APK"
