name: Admin Worker Deployment

on:
  push:
    branches: [admin]
    paths:
      - 'duka_pos_admin/**'
      - '.github/workflows/admin-worker-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, deploy, and verify admin Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: duka_pos_admin

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: duka_pos_admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build Worker
        run: npx cf build

      - name: Validate deployment bundle
        run: npx cf deploy --prebuilt --mode production --dry-run

      - name: Retain prebuilt Worker bundle
        uses: actions/upload-artifact@v4
        with:
          name: admin-worker-build
          path: duka_pos_admin/.cloudflare/output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Check admin deployment token
        env:
          CLOUDFLARE_ADMIN_API_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ADMIN_API_TOKEN" ] ||
            [ "$CLOUDFLARE_ADMIN_API_TOKEN" = "REPLACE_WITH_REAL_CLOUDFLARE_ADMIN_API_TOKEN" ]; then
            echo "::error::Set the CLOUDFLARE_ADMIN_API_TOKEN repository secret to a Cloudflare API token with Workers Editor access for analytics."
            exit 1
          fi

      - name: Deploy production Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN }}
        run: npx cf deploy --prebuilt --mode production

      - name: Verify admin Worker and backend health
        shell: bash
        env:
          ADMIN_URL: https://analytics.brianbmk332.workers.dev
          BACKEND_URL: https://duka-pos-backend.brianbmk332.workers.dev
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --output /dev/null "${ADMIN_URL}/login"
          curl --fail --silent --show-error --output /dev/null "${BACKEND_URL}/health"
          curl --fail --silent --show-error --output /dev/null "${BACKEND_URL}/ready"

          headers_file="${RUNNER_TEMP}/admin-api.headers"
          body_file="${RUNNER_TEMP}/admin-api.json"
          status=$(curl --silent --show-error \
            --dump-header "$headers_file" \
            --output "$body_file" \
            --write-out '%{http_code}' \
            "${ADMIN_URL}/api/admin/auth/session")
          if [ "$status" != "401" ] ||
            ! grep -Eiq '^content-type: application/json([;[:space:]]|$)' "$headers_file" ||
            ! jq -e 'type == "object" and has("error")' "$body_file" >/dev/null; then
            echo "::error::Admin session endpoint did not reject an unauthenticated request with JSON 401 (status: ${status})."
            exit 1
          fi
          echo "Admin Worker and backend health checks passed."
