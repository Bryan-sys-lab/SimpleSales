name: Backend CI

# Validation for the KRA/eTIMS backend.
#
# Separate from `ci.yml` rather than a second job in it, for a reason that is
# not stylistic: `main`'s `.gitignore` excludes `/duka_pos_backend/` — on that
# branch the directory is a stale checkout leftover, not source — while the
# backend branch tracks all forty files. A backend job in a workflow triggered
# only by `main` therefore checks out a tree with no `duka_pos_backend/` at all
# and fails at `npm ci`. Putting it here means each workflow runs against a
# branch where its code actually exists.
#
# There is no release or deploy path for the backend. `release.yml` publishes
# the signed APK from a tag on `main` and does not touch this directory, so the
# backend is validated on every push and deployed by hand.
on:
  # The backend pipeline belongs only to the branch of record. The app's main
  # branch has its own workflow and must never start this stack pipeline.
  push:
    branches: [backend]
  pull_request:
    branches: [backend]
  workflow_dispatch:

# Cancel superseded runs, matching ci.yml: a rapid push-to-PR sequence should not
# burn runner minutes on commits that are already obsolete.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Type-check, validate schema, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: duka_pos_backend

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: duka_pos_backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `prisma generate` before `tsc`, and in that order. Without the generated
      # client every `prisma.<model>` in the codebase is an unknown property and
      # the build fails with dozens of errors that have nothing to do with the
      # change being made. This ordering is the single easiest thing to get wrong.
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/duka_pos
        run: npx prisma generate

      - name: Type-check and build
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/duka_pos
        run: npm run build

      # The schema is not type-checked by `tsc`. A migration and a schema that
      # disagree pass every other step here and fail at deploy, which is the one
      # moment nobody wants to discover it.
      - name: Validate the Prisma schema
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/duka_pos
        run: npx prisma validate

      # The dependency audit is a gate, not a report. Every vulnerability found
      # in this service is currently dev-only (`vitest` → `vite` → `esbuild`),
      # which is exactly why it is easy to leave one critical in place for months
      # unnoticed: nothing about it breaks the build.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run tests
        env:
          DATABASE_URL: postgresql://localhost:5432/duka_pos_test
          OIDC_ISSUER_URL: https://id.example.test/realms/duka
          OIDC_AUDIENCE: duka-api
        run: npm test

  # ------------------------------------------------------------------
  # The whole stack, started for real.
  #
  # The job above proves the code compiles and its arithmetic is right. It
  # proves NOTHING about whether the service actually runs: not that the
  # migrations apply to a real database, not that the identity provider is
  # reachable, not that the routes answer.
  #
  # This job starts the stack the way it is meant to run — Postgres, Keycloak,
  # the API, the migrations — and then exercises it from the outside: the
  # smoke collection, the end-to-end collection, and the API's own health and
  # readiness probes.
  #
  # It is a separate job because it needs Docker and a database, and because a
  # failure here means something different from a failure there: this one says
  # the SERVICE does not start.
  # ------------------------------------------------------------------
  stack:
    name: The whole stack, started and exercised
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The ephemeral CI stack runs several live journeys and three Postman
      # collections in one minute. Production keeps the default limit of 120.
      RATE_LIMIT_LIMIT: 10000
    defaults:
      run:
        working-directory: duka_pos_backend

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build the backend and test images first
        # The helper services reference the same local backend image. A clean
        # GitHub runner has no local tag yet, so build it explicitly before
        # Compose resolves migrate/keycloak-init/storage-init.
        run: docker compose build backend tests

      - name: Start the full local stack
        shell: bash
        run: |
          set +e
          docker compose up -d
          status=$?
          if [[ $status -ne 0 ]]; then
            docker compose ps
            docker compose logs --no-color migrate keycloak-init storage-init backend
            exit "$status"
          fi

      - name: Wait for the API to be healthy
        # The stack's own health check is the gate, and the wait is for the
        # thing the health check measures: the API answering /health. Without
        # this the smoke test races the server and fails for a reason that
        # looks like a broken endpoint.
        run: |
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:3100/health > /dev/null; then
              echo "The API is up."
              exit 0
            fi
            echo "Waiting for the API ($attempt)..."
            sleep 5
          done
          echo "::error::The API did not become healthy in five minutes."
          docker compose logs
          exit 1

      - name: The migrations applied
        # The API container applies them before it starts, so an empty schema
        # is a failure of the build and not a mystery at the first query.
        run: |
          docker compose exec -T db \
            psql -U duka_pos -d duka_pos -c '\dt' | head -30

      - name: The API is ready
        run: |
          curl --silent --fail http://localhost:3100/ready
          echo

      - name: The test suite, against the live stack
        # The same suite, run in the stack with the stack's environment: a
        # real DATABASE_URL, the real issuer, the real audience. The unit
        # assertions do not need any of it, and that is the point — a suite
        # that only passes with a fake database URL is a suite that has never
        # met the real one.
        run: |
          docker compose --profile verify run --rm tests sh -lc '
            npm test &&
            BASE_URL=http://backend:3000 npm run test:live &&
            BASE_URL=http://backend:3000 npm run test:live:auth &&
            BASE_URL=http://backend:3000 npm run test:live:analytics &&
            BASE_URL=http://backend:3000 npm run test:live:backup &&
            BASE_URL=http://backend:3000 npm run test:load &&
            npx --yes newman@latest run postman/duka-pos-live-smoke.postman_collection.json --env-var base_url=http://backend:3000 &&
            npx --yes newman@latest run postman/duka-pos-backend.postman_collection.json --env-var base_url=http://backend:3000 &&
            npx --yes newman@latest run postman/duka-pos-e2e.postman_collection.json --env-var base_url=http://backend:3000 --env-var verification_code=123456
          '

      - name: The stack's logs, whatever happened
        # Written on the way out, so a failure can be read without a rerun.
        if: always()
        run: docker compose logs --no-color | tail -200

      - name: Tear the stack down
        if: always()
        run: docker compose down -v
