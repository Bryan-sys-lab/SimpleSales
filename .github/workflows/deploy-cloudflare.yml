name: Deploy backend to Cloudflare Containers

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production backend
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: duka_pos_backend/cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out the CI-tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: duka_pos_backend/cloudflare/package-lock.json

      - name: Install deployment dependencies
        run: npm ci

      - name: Validate Cloudflare credentials are present
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::${name} is not configured in GitHub Actions secrets."
              exit 1
            fi
          done

      - name: Deploy Worker and Container image
        run: npx wrangler deploy --config wrangler.jsonc --containers-rollout=none

      - name: Set backend runtime secrets
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.BACKEND_DATABASE_URL }}
          OIDC_ISSUER_URL: ${{ secrets.BACKEND_OIDC_ISSUER_URL }}
          OIDC_AUDIENCE: ${{ secrets.BACKEND_OIDC_AUDIENCE }}
          OIDC_JWKS_URI: ${{ secrets.BACKEND_OIDC_JWKS_URI }}
          FRONTEND_URL: ${{ secrets.BACKEND_FRONTEND_URL }}
          PUBLIC_API_URL: ${{ secrets.BACKEND_PUBLIC_API_URL }}
          PAYHERO_AUTH_TOKEN: ${{ secrets.BACKEND_PAYHERO_AUTH_TOKEN }}
          PAYHERO_ACCOUNT_ID: ${{ secrets.BACKEND_PAYHERO_ACCOUNT_ID }}
          MPESA_CALLBACK_KEY: ${{ secrets.BACKEND_MPESA_CALLBACK_KEY }}
          SYSTEM_ADMIN_SUBJECTS: ${{ secrets.BACKEND_SYSTEM_ADMIN_SUBJECTS }}
          R2_ENDPOINT: ${{ secrets.BACKEND_R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.BACKEND_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.BACKEND_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.BACKEND_R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.BACKEND_R2_PUBLIC_URL }}
          TAX_ENTITY_ENCRYPTION_KEY: ${{ secrets.BACKEND_TAX_ENTITY_ENCRYPTION_KEY }}
          TAX_REPORTING_ACTIVATED: ${{ secrets.BACKEND_TAX_REPORTING_ACTIVATED }}
          RISITI_BASE_URL: ${{ secrets.BACKEND_RISITI_BASE_URL }}
          RISITI_API_KEY: ${{ secrets.BACKEND_RISITI_API_KEY }}
          APP_VERSION_NAME: ${{ secrets.BACKEND_APP_VERSION_NAME }}
          APP_VERSION_CODE: ${{ secrets.BACKEND_APP_VERSION_CODE }}
          APP_DOWNLOAD_URL: ${{ secrets.BACKEND_APP_DOWNLOAD_URL }}
          APP_UPDATE_REQUIRED: ${{ secrets.BACKEND_APP_UPDATE_REQUIRED }}
          APP_RELEASE_NOTES: ${{ secrets.BACKEND_APP_RELEASE_NOTES }}
        run: |
          set -Eeuo pipefail
          names=(DATABASE_URL OIDC_ISSUER_URL OIDC_AUDIENCE OIDC_JWKS_URI FRONTEND_URL PUBLIC_API_URL PAYHERO_AUTH_TOKEN PAYHERO_ACCOUNT_ID MPESA_CALLBACK_KEY SYSTEM_ADMIN_SUBJECTS R2_ENDPOINT R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME R2_PUBLIC_URL TAX_ENTITY_ENCRYPTION_KEY TAX_REPORTING_ACTIVATED RISITI_BASE_URL RISITI_API_KEY APP_VERSION_NAME APP_VERSION_CODE APP_DOWNLOAD_URL APP_UPDATE_REQUIRED APP_RELEASE_NOTES)
          for name in "${names[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::${name} is not configured as a GitHub Actions secret."
              exit 1
            fi
            printf '%s' "${!name}" | npx wrangler secret put "${name}" --config wrangler.jsonc
          done

      - name: Roll out the image with runtime configuration
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Show deployed Worker
        run: npx wrangler deployments list --config wrangler.jsonc
