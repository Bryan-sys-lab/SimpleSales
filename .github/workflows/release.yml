name: Release

# Produces the signed, distributable APK and attaches it to a GitHub Release.
#
# Trigger:
#   git tag v1.4.0 && git push origin v1.4.0
#
# The version in the tag MUST equal the `version:` in duka_pos_app/pubspec.yaml.
# That single check is what keeps the APK's own versionName/versionCode — which
# Flutter reads from pubspec — from disagreeing with the release it is sold as.
#
# It is also dispatched by auto-release.yml once it has tagged a green main.
# auto-release used to rely on the tag push alone, and GitHub declined to start
# this workflow for those pushes: nineteen tags arrived and Release never ran
# once, so no APK was ever published from them. Driving it with an explicit
# dispatch makes publishing depend on a call we can see fail rather than on an
# event GitHub may or may not deliver.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Serialise releases: two tags pushed at once must not race to publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Creating a GitHub Release requires write access; nothing else in this
# workflow needs more than read.
permissions:
  contents: write

jobs:
  release:
    name: Build signed APK and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: duka_pos_app

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # Full history so the tag-on-main guard can walk ancestry.
          fetch-depth: 0

      - name: Set up Flutter and Android SDK
        uses: ./.github/actions/setup-flutter-android

      # A tag can point at any commit, including one that never passed CI or
      # was never merged. Refuse to publish unreviewed code.
      - name: Verify tag points at a commit on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin app
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/app; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at a commit that is not on app. Refusing to release."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} is on app."

      # The tag carries both halves of the version: `v<semver>+<build>`.
      #
      # Both halves come from pubspec.yaml, and both are a human's decision:
      # this workflow never changes either, and neither does auto-release.yml,
      # which only copies them into a tag. That is not tidiness — it is the
      # only way the tag and the APK can agree, because Flutter reads the
      # versionName and the versionCode out of pubspec and puts nothing else
      # into the APK.
      #
      # Both halves are in the tag because Android keys the install on
      # versionCode alone: two releases of 2.0.0 at builds 7 and 8 are different
      # APKs to a handset, and `v2.0.0` cannot name both. The build number is
      # also never reused, because a reused one produces an APK that silently
      # refuses to update an installed till.
      #
      # Guarded here as well as in the tagger, because a release can equally be
      # driven by hand — `git tag v2.0.1+9 && git push origin v2.0.1+9` — and this
      # job is the last thing between a typo and a published artefact.
      - name: Verify the tag matches the pubspec version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          pubspec_line="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          pubspec_name="${pubspec_line%%+*}"
          pubspec_code="${pubspec_line##*+}"
          # The literal `v` is required rather than stripped with ${var#v}.
          # Stripping means a tag named "2.0.0+4" is silently accepted as though
          # it were "v2.0.0+4", and this job can be driven by hand, so the tag
          # that reaches it is whatever a person typed.
          if [[ "${GITHUB_REF_NAME}" != v* ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' must begin with 'v'."
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"

          # pubspec's own semver is validated rather than trusted. auto-release.yml
          # checks it before minting a tag, but a hand-driven release never goes
          # near that workflow, and "releases whatever pubspec says" is only a
          # safe statement if "says" means something well-formed.
          if ! [[ "$pubspec_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::pubspec version '${pubspec_name}' is not a recognisable semver."
            exit 1
          fi

          if ! [[ "$tag" =~ ^(.+)\+([0-9]+)$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' must be v<semver>+<build>, for example v2.0.1+4."
            echo "::error::Got '${tag}'."
            exit 1
          fi
          tag_name="${BASH_REMATCH[1]}"
          tag_code="${BASH_REMATCH[2]}"

          echo "name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "code=${tag_code}" >> "$GITHUB_OUTPUT"

          if [ "$tag_name" != "$pubspec_name" ]; then
            echo "::error::Tag version ${tag_name} does not match pubspec ${pubspec_name}."
            echo "::error::This workflow releases whatever pubspec declares; change pubspec, or tag the version it declares."
            exit 1
          fi
          if ! [[ "$pubspec_code" =~ ^[0-9]+$ ]] || [ "$pubspec_code" -lt 1 ]; then
            echo "::error::pubspec build number '${pubspec_code}' is not a positive integer."
            exit 1
          fi
          # Exact equality, not "the tag may be higher".
          #
          # Flutter reads the APK's versionCode from pubspec, so this build can
          # only ever carry ${pubspec_code}. A tag naming a different number
          # describes an APK that cannot exist, and the release would spend
          # ten minutes building one before failing at the version check and
          # publishing nothing — which is exactly how v2.0.0+27 failed: the tag
          # said 27, the APK said 26.
          #
          # Failing here instead means the mismatch costs seconds, and the
          # message says what to change.
          if [ "$tag_code" != "$pubspec_code" ]; then
            echo "::error::Tag build number ${tag_code} does not match the pubspec build number ${pubspec_code}."
            echo "::error::This APK is built from pubspec, so it carries versionCode ${pubspec_code} and can never be published as build ${tag_code}."
            echo "::error::Set the build number in duka_pos_app/pubspec.yaml to ${tag_code}, or release it as v${pubspec_name}+${pubspec_code}."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches pubspec ${pubspec_line}."

      # The last line of defence against publishing a build a handset cannot
      # install. Re-running a failed release is allowed to repeat its own build
      # number, so equality with an existing tag is fine and only a *lower*
      # number is refused.
      - name: Verify this build number has not been released before
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          semver="${{ steps.version.outputs.name }}"
          code="${{ steps.version.outputs.code }}"

          highest=0
          for tag in $(git tag --list "v${semver}+*"); do
            other="${tag##*+}"
            if [[ "$other" =~ ^[0-9]+$ ]] && [ "$other" -gt "$highest" ]; then
              highest="$other"
            fi
          done
          echo "Highest released build of ${semver}: ${highest}"

          if [ "$code" -lt "$highest" ]; then
            echo "::error::Build ${code} of ${semver} is below the highest already released (${highest})."
            echo "::error::Publishing it would produce an APK that cannot update a device already on ${highest}."
            exit 1
          fi
          echo "Build ${code} is current."

      - name: Analyze
        run: flutter analyze --fatal-infos

      # The keystore is reconstructed only inside this ephemeral runner and is
      # never committed. It is masked in logs, and the file is deleted before the
      # release is published.
      - name: Reconstruct the release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_FILE_NAME: duka-pos-release.jks
        run: |
          set -euo pipefail
          for var in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS; do
            if [ -z "${!var}" ]; then
              echo "::error::Secret ${var} is not set. Add it under Settings > Secrets and variables > Actions."
              exit 1
            fi
          done

          # KEY_PASSWORD is optional and deliberately so. A keystore made with a
          # plain `keytool -genkeypair` and no -keypass shares one password
          # between the store and the key, and this project's key.properties has
          # no keyPassword entry at all. Requiring it would block a release over
          # a value that does not exist. When it is supplied it wins, so a
          # keystore that does use a separate key password still works.
          KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"

          echo "$KEYSTORE_BASE64" | base64 --decode > "android/$KEYSTORE_FILE_NAME"

          # Fail here rather than deep inside Gradle if the secret is corrupt or
          # the passwords are wrong — the message is otherwise very opaque.
          keytool -list -keystore "android/$KEYSTORE_FILE_NAME" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null

          # Consumed by android/app/build.gradle.kts. storeFile is written as an
          # absolute path because it is resolved with Project.file() from the
          # :app module directory, and the workspace path is not known until run
          # time. The file is gitignored, so it never enters the repository.
          cat > android/key.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/duka_pos_app/android/$KEYSTORE_FILE_NAME
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 android/key.properties

      # Compile-time configuration for the downloadable release artifact.
      # The release must point at the deployed API and OIDC Worker; an
      # offline-only APK is not a final connected release.
      - name: Validate release configuration
        id: config
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          OIDC_ISSUER_URL: ${{ secrets.OIDC_ISSUER_URL }}
          OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
          OIDC_REDIRECT_URL: ${{ secrets.OIDC_REDIRECT_URL }}
          OIDC_API_SCOPE: ${{ secrets.OIDC_API_SCOPE }}
        run: |
          set -euo pipefail

          if [ -z "${SENTRY_DSN}" ]; then
            echo "::warning::SENTRY_DSN is not set; this build ships without crash reporting."
          fi

          if [[ -n "${OIDC_REDIRECT_URL}" && "${OIDC_REDIRECT_URL}" != *://* ]]; then
            echo "::error::OIDC_REDIRECT_URL must include a URI scheme, for example dukapos://callback."
            exit 1
          fi
          echo "Connected release configuration validated."

      - name: Build signed release APK
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          OIDC_ISSUER_URL: ${{ secrets.OIDC_ISSUER_URL }}
          OIDC_REDIRECT_URL: ${{ secrets.OIDC_REDIRECT_URL }}
          OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
          OIDC_API_SCOPE: ${{ secrets.OIDC_API_SCOPE }}
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"

          # A single universal APK, not --split-per-abi: it is sideloaded onto
          # whatever ARM device a shop owns, so one file has to work everywhere.
          #
          # --obfuscate is deliberately NOT used. It would need its symbol maps
          # uploaded to Sentry per build or every release crash report becomes
          # unreadable; the app is not obfuscated to protect a local-only ledger.
          # Only values that are actually set are injected.
          #
          # Passing an empty --dart-define is not the same as omitting it: it
          # OVERRIDES the app's String.fromEnvironment defaultValue with an empty
          # string, so an unset BACKEND_URL would ship as "" rather than falling
          # back to the app's own placeholder. Omitting the flag lets the app's
          # defaults stand, which keeps one source of truth for them — here and
          # in backend_service.dart — instead of duplicating every default in two
          # places.
          defines=()
          add_define() {
            if [ -n "$2" ]; then
              defines+=("--dart-define=$1=$2")
            else
              echo "::warning::$1 not injected; the app's built-in default applies."
            fi
          }
          add_define SENTRY_DSN "$SENTRY_DSN"
          add_define BACKEND_URL "$BACKEND_URL"
          add_define OIDC_ISSUER_URL "$OIDC_ISSUER_URL"
          add_define OIDC_CLIENT_ID "$OIDC_CLIENT_ID"
          add_define OIDC_REDIRECT_URL "$OIDC_REDIRECT_URL"
          add_define OIDC_API_SCOPE "$OIDC_API_SCOPE"

          # The manifest placeholder and the dart-define have to agree on the
          # scheme: AppAuth's manifest filters the callback on
          # ${appAuthRedirectScheme} while OidcService passes OIDC_REDIRECT_URL
          # to the authorization request. Deriving both from the one secret
          # removes the drift where sign-in silently never returns to the app.
          gradle_args=()
          if [ -n "${OIDC_REDIRECT_URL}" ]; then
            redirect_scheme="${OIDC_REDIRECT_URL%%:*}"
            redirect_scheme="$(printf '%s' "$redirect_scheme" | tr '[:upper:]' '[:lower:]')"
            if [ -z "$redirect_scheme" ]; then
              echo "::error::Could not read a scheme out of OIDC_REDIRECT_URL='${OIDC_REDIRECT_URL}'."
              exit 1
            fi
            echo "Callback scheme: ${redirect_scheme}"
            gradle_args+=("--android-project-arg=appAuthRedirectScheme=${redirect_scheme}")
          else
            echo "::warning::OIDC_REDIRECT_URL is not set; the manifest keeps its built-in default scheme."
          fi

          echo "dart-defines injected: ${#defines[@]}"
          flutter build apk --release ${gradle_args[@]+"${gradle_args[@]}"} ${defines[@]+"${defines[@]}"}

          test -f "$apk" || { echo "::error::Expected APK not found at $apk"; exit 1; }

          # Hand the APK a release-shaped name before it leaves the workspace.
          mv "$apk" "build/SimpleSales-${GITHUB_REF_NAME}.apk"
          ls -lh build/*.apk

      # Proves the artefact is signed by a real key and reports which one, so a
      # debug-signed or unsigned APK can never be published unnoticed.
      # Proves the artefact is signed by a real key and reports which one, so a
      # debug-signed or unsigned APK can never be published unnoticed.
      - name: Verify the APK is signed by the release key
        shell: bash
        env:
          EXPECTED_SIGNING_CERT_SHA256: ${{ vars.EXPECTED_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk="build/SimpleSales-${GITHUB_REF_NAME}.apk"

          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          certs="$("$apksigner" verify --verbose --print-certs "$apk")"
          printf '%s\n' "$certs"

          # apksigner labels the digest by signature scheme — "V2 Signer:
          # certificate SHA-256 digest: <hex>" — and prints bare hex with no
          # colons. Matching a fixed "Signer #1 ..." label instead fails on every
          # real APK, so match the field name and take whatever follows it.
          digest="$(printf '%s\n' "$certs" \
            | grep -iE 'certificate SHA-256 digest:' \
            | head -1 \
            | sed 's/.*certificate SHA-256 digest: *//')"

          if [ -z "$digest" ]; then
            echo "::error::The APK reported no SHA-256 signer certificate digest, so its signature could not be identified."
            echo "::error::Refusing to publish an APK whose signer is unknown."
            exit 1
          fi
          echo "Signing certificate SHA-256: ${digest}"

          # Set EXPECTED_SIGNING_CERT_SHA256 to make this strict. Colons and case
          # are normalised on both sides, so the value can be pasted either as
          # apksigner prints it or as keytool does.
          if [ -n "$EXPECTED_SIGNING_CERT_SHA256" ]; then
            actual="$(printf '%s' "$digest" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            expected="$(printf '%s' "$EXPECTED_SIGNING_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            if [ "$actual" != "$expected" ]; then
              echo "::error::APK signer ${digest} does not match EXPECTED_SIGNING_CERT_SHA256 ${EXPECTED_SIGNING_CERT_SHA256}."
              exit 1
            fi
            echo "Signing certificate matches the expected release key."
          fi

      # Confirms the binary reports the version it is being released as, on both
      # halves. Closing the loop on the pubspec check is not enough: the tag
      # could be right and the APK wrong, and that APK is the thing that ships.
      #
      # versionName carries the semver alone. Flutter splits pubspec `2.0.0+4`
      # into Android's versionName="2.0.0" and versionCode=4, so comparing
      # versionName against the whole `v2.0.0+4` tag fails on every correct
      # build. versionCode is compared too, which the previous check never did:
      # it is the half Android actually refuses to downgrade on, so it is the
      # half worth asserting.
      - name: Verify the APK reports the released version
        shell: bash
        run: |
          set -euo pipefail
          apk="build/SimpleSales-${GITHUB_REF_NAME}.apk"
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"

          badging="$("$aapt2" dump badging "$apk" | head -1)"
          echo "$badging"

          expected_name="${{ steps.version.outputs.name }}"
          expected_code="${{ steps.version.outputs.code }}"
          actual_name="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$badging")"
          actual_code="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<<"$badging")"

          if [ -z "$actual_name" ] || [ -z "$actual_code" ]; then
            echo "::error::Could not read versionName/versionCode out of the APK's badging output."
            echo "::error::Refusing to publish an APK whose version cannot be identified."
            exit 1
          fi

          if [ "$actual_name" != "$expected_name" ]; then
            echo "::error::APK versionName '${actual_name}' does not match the release version '${expected_name}'."
            exit 1
          fi

          if [ "$actual_code" != "$expected_code" ]; then
            echo "::error::APK versionCode '${actual_code}' does not match the tag's build number '${expected_code}'."
            echo "::error::A handset already on ${actual_code} would refuse to install this one."
            exit 1
          fi

          echo "APK reports versionName=${actual_name} versionCode=${actual_code}, as released."

      - name: Remove signing material from the workspace
        if: always()
        shell: bash
        run: |
          rm -f android/key.properties android/duka-pos-release.jks
          rm -f "$RUNNER_TEMP"/duka_pos_keystore.jks 2>/dev/null || true

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleSales-${{ github.ref_name }}-apk
          path: duka_pos_app/build/SimpleSales-${{ github.ref_name }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="build/SimpleSales-${GITHUB_REF_NAME}.apk"

          {
            echo "Duka POS ${GITHUB_REF_NAME}"
            echo
            echo "Signed release build (build \`${{ steps.version.outputs.code }}\`)."
            echo
            echo "Install on a shop device by enabling *Install unknown apps* for"
            echo "your file manager, then opening the APK. An upgrade over an"
            echo "existing install works because the build number increases."
            echo
            if [ "${{ steps.config.outputs.offline_only }}" = "true" ]; then
              echo "> **Offline-only build.**"
              echo ">"
              echo "> This APK was built without \`BACKEND_URL\` and/or \`OIDC_ISSUER_URL\`, so it"
              echo "> was compiled against the app's built-in placeholder endpoints."
              echo ">"
              echo "> - **Works:** cash sales, stock, reports, staff PIN sign-in, backups."
              echo ">   Sales are recorded in the till's own database."
              echo "> - **Does not work:** M-Pesa mobile money, catalogue sync, and online"
              echo ">   sign-in. Do not sell to customers expecting change from M-Pesa on"
              echo ">   this build."
              echo ">"
              echo "> Set the repository secrets \`BACKEND_URL\` and \`OIDC_ISSUER_URL\` and"
              echo "> re-tag to publish a fully wired build."
            else
              echo "Backend and sign-in endpoints are configured in this build."
            fi
            echo
            echo "**Verify the checksum before installing:**"
            echo '```'
            sha256sum "$apk"
            echo '```'
          } > release_notes.md

          # Draft, then published. A release that builds and verifies gets
          # published by the step below; one that fails after this point still
          # leaves a visible record that this commit was built for release and did
          # not ship, which a release that simply never existed cannot. The
          # alternative — creating nothing on failure — makes an outage and a
          # deliberate skip look identical.
          #
          # `gh release edit --draft=false` is a no-op on an already-published
          # release, so a re-run is safe.
          gh release create "${GITHUB_REF_NAME}" \
            --title "Duka POS ${GITHUB_REF_NAME}" \
            --notes-file release_notes.md \
            --draft \
            "$apk"

          gh release edit "${GITHUB_REF_NAME}" --draft=false
          echo "Published ${GITHUB_REF_NAME}."

      - name: Update backend release manifest
        if: success()
        shell: bash
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CI_TOKEN: ${{ secrets.NERVA_CI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${BACKEND_URL}" ] || [ -z "${CI_TOKEN}" ] || [[ "${BACKEND_URL}" == *your-backend* ]] || [[ "${BACKEND_URL}" == *example.com* ]] || [[ "${BACKEND_URL}" == *example.test* ]]; then
            echo "::warning::BACKEND_URL is not a reachable deployment; skipping backend manifest update."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          build="${{ steps.version.outputs.code }}"
          download_url="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/duka-pos-${GITHUB_REF_NAME}.apk"
          payload="$(jq -n \
            --arg version "$version" \
            --argjson build "$build" \
            --arg url "$download_url" \
            '{version: $version, build: $build, downloadUrl: $url, channel: "stable"}')"
          curl --fail-with-body --silent --show-error --location \
            --retry 3 --retry-delay 2 --max-time 30 \
            -X POST "${BACKEND_URL%/}/api/app/release" \
            -H "x-ci-token: ${CI_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$payload"
          echo
          echo "Backend manifest updated to ${version} (build ${build})."

      # Publishing the release above with the default GITHUB_TOKEN does not
      # start another workflow run (GitHub suppresses cascading runs for its
      # own token), so publish-nerva-release.yml would never fire on its own.
      # Dispatch it explicitly, the same way auto-release.yml drives this
      # workflow, so the build's metadata actually reaches Nerva.
      - name: Publish release metadata to Nerva
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::Secret RELEASE_TAG_TOKEN is not set."
            echo "::error::The Nerva publish step needs a credential GitHub will run workflows for."
            exit 1
          fi
          tag="${GITHUB_REF_NAME}"
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if ! gh workflow run publish-nerva-release.yml --ref app -f "tag=${tag}"; then
            echo "::warning::Could not dispatch publish-nerva-release.yml for ${tag}; release metadata not published."
            exit 0
          fi
          for attempt in 1 2 3 4 5 6; do
            sleep 10
            run_id="$(gh run list --workflow publish-nerva-release.yml --branch app --limit 10 --json databaseId,createdAt --jq "[.[] | select(.createdAt > \"${started_at}\")][0].databaseId" 2>/dev/null || true)"
            if [ -n "${run_id}" ]; then
              echo "publish-nerva-release.yml is running for ${tag} (run ${run_id})."
              exit 0
            fi
            echo "Waiting for the ${tag} Nerva publish run to appear (attempt ${attempt}/6)."
          done
          echo "::error::Dispatched publish-nerva-release.yml for ${tag} but no run appeared within a minute."
          exit 1
