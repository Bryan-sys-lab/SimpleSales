name: Duka POS Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: duka_pos
          POSTGRES_PASSWORD: [REDACTED]
          POSTGRES_DB: duka_pos
        options: >-
          --health-cmd "pg_isready -U duka_pos -d duka_pos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      keycloak:
        image: quay.io/keycloak/keycloak:24.0.1
        env:
          KC_DB: postgres
          KC_DB_URL: jdbc:postgresql://db:5432/keycloak
          KC_DB_USERNAME: keycloak
          KC_DB_PASSWORD: [REDACTED]
          KEYCLOAK_ADMIN: admin
          KEYCLOAK_ADMIN_PASSWORD: [REDACTED]
        command: start-dev
        options: >-
          --health-cmd "curl -f http://localhost:8080/health/ready || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 8080:8080

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install backend dependencies
        working-directory: ./duka_pos_backend
        run: npm ci --include=dev

      - name: Generate Prisma Client
        working-directory: ./duka_pos_backend
        run: npx prisma generate

      - name: Build TypeScript
        working-directory: ./duka_pos_backend
        run: npm run build

      - name: Deploy database schema (live DB)
        working-directory: ./duka_pos_backend
        env:
          DATABASE_URL: postgresql://duka_pos:[REDACTED]@localhost:5432/duka_pos
        run: npx prisma db push --accept-data-loss

      - name: Setup Keycloak realm, client, and test user
        working-directory: ./duka_pos_backend
        env:
          KEYCLOAK_URL: http://localhost:8080
          KEYCLOAK_ADMIN: admin
          KEYCLOAK_ADMIN_PASSWORD: [REDACTED]
          REALM_NAME: duka
          CLIENT_ID: duka-app
          TEST_USER: test-user
          TEST_USER_PASSWORD: [REDACTED]
          TEST_USER_EMAIL: test-user@example.com
        run: |
          # Wait for Keycloak to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health/ready > /dev/null 2>&1; then
              echo "Keycloak is ready!"
              break
            fi
            echo "Waiting for Keycloak... ($i/30)"
            sleep 2
          done

          # Get admin token
          ADMIN_TOKEN=$(curl -s -X POST http://localhost:8080/realms/master/protocol/openid-connect/token \
            -d "grant_type=password" \
            -d "client_id=admin-cli" \
            -d "username=${KEYCLOAK_ADMIN}" \
            -d "password=${KEYCLOAK_ADMIN_PASSWORD}" | jq -r '.access_token')

          # Create realm
          curl -s -X POST http://localhost:8080/admin/realms \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"enabled\": true, \"realm\": \"${REALM_NAME}\", \"displayName\": \"Duka POS\"}" > /dev/null || true

          # Create client
          curl -s -X POST http://localhost:8080/admin/realms/${REALM_NAME}/clients \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"clientId\": \"${CLIENT_ID}\",
              \"enabled\": true,
              \"publicClient\": true,
              \"protocol\": \"openid-connect\",
              \"standardFlowEnabled\": true,
              \"implicitFlowEnabled\": false,
              \"directAccessGrantsEnabled\": true,
              \"serviceAccountsEnabled\": false,
              \"redirectUris\": [\"http://localhost:*\"],
              \"webOrigins\": [\"*\"]
            }" > /dev/null || true

          # Create test user
          curl -s -X POST http://localhost:8080/admin/realms/${REALM_NAME}/users \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"username\": \"${TEST_USER}\",
              \"email\": \"${TEST_USER_EMAIL}\",
              \"enabled\": true,
              \"emailVerified\": true,
              \"firstName\": \"Test\",
              \"lastName\": \"User\",
              \"credentials\": [{
                \"type\": \"password\",
                \"value\": \"${TEST_USER_PASSWORD}\",
                \"temporary\": false
              }]
            }" > /dev/null || true

          echo "Keycloak setup complete!"

      - name: Start backend server
        working-directory: ./duka_pos_backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://duka_pos:[REDACTED]@localhost:5432/duka_pos
          OIDC_ISSUER_URL: http://localhost:8080/realms/duka
          OIDC_AUDIENCE: duka-api
          OIDC_JWKS_URI: http://localhost:8080/realms/duka/protocol/openid-connect/certs
          PAYHERO_AUTH_TOKEN: payhero_live_token_2024_#L9nX4vW7!
          SYSTEM_ADMIN_SUBJECTS: admin-subject
          KEYCLOAK_URL: http://localhost:8080
          KEYCLOAK_ADMIN: admin
          KEYCLOAK_ADMIN_PASSWORD: [REDACTED]
          REALM_NAME: duka
          CLIENT_ID: duka-app
          TEST_USER: test-user
          TEST_USER_PASSWORD: [REDACTED]
        run: |
          nohup node dist/index.js > backend.log 2>&1 &
          echo $! > backend.pid
          # Wait for backend to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
              echo "Backend is ready!"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          cat backend.log

      - name: Run Vitest integration tests (live database)
        working-directory: ./duka_pos_backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://duka_pos:[REDACTED]@localhost:5432/duka_pos
          OIDC_ISSUER_URL: http://localhost:8080/realms/duka
          OIDC_AUDIENCE: duka-api
          OIDC_JWKS_URI: http://localhost:8080/realms/duka/protocol/openid-connect/certs
          PAYHERO_AUTH_TOKEN: payhero_live_token_2024_#L9nX4vW7!
          SYSTEM_ADMIN_SUBJECTS: admin-subject
          KEYCLOAK_URL: http://localhost:8080
          KEYCLOAK_ADMIN: admin
          KEYCLOAK_ADMIN_PASSWORD: [REDACTED]
          REALM_NAME: duka
          CLIENT_ID: duka-app
          TEST_USER: test-user
          TEST_USER_PASSWORD: [REDACTED]
          BACKEND_URL: http://localhost:3000/api
        run: npx vitest run

      - name: Run Newman Postman e2e tests (live database + backend)
        working-directory: ./duka_pos_backend
        env:
          BACKEND_URL: http://localhost:3000/api
        run: |
          npx newman run postman/duka-pos-e2e.postman_collection.json \
            --env-var "base_url=http://localhost:3000" \
            --reporters cli,json \
            --reporter-json-export newman-e2e-report.json || true

      - name: Stop backend server
        if: always()
        working-directory: ./duka_pos_backend
        run: |
          if [ -f backend.pid ]; then kill $(cat backend.pid) 2>/dev/null || true; fi

      - name: Upload Newman e2e report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-e2e-report
          path: duka_pos_backend/newman-e2e-report.json

      - name: Upload vitest results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-results
          path: duka_pos_backend/

      - name: Docker build backend
        working-directory: ./duka_pos_backend
        run: docker build -t duka-pos-backend:latest .

      - name: Security audit
        working-directory: ./duka_pos_backend
        run: |
          echo "=== Security Header Verification ==="
          curl -sI http://localhost:3000/health 2>/dev/null | grep -iE "x-content-type-options|x-frame-options|content-security-policy|referrer-policy|x-powered-by|strict-transport" || true
          echo ""
          echo "=== CORS Check ==="
          curl -s -o /dev/null -w "%{http_code}" -H "Origin: http://evil.com" http://localhost:3000/health 2>/dev/null || true
          echo ""
          echo "=== Rate Limit Check ==="
          for i in $(seq 1 150); do
            curl -s -o /dev/null -w "%{http_code} " -X POST http://localhost:3000/api/auth/link \
              -H "Content-Type: application/json" \
              -d "{\"email\":\"sec${i}@example.com\",\"pin\":\"1234\",\"shopName\":\"Sec\",\"ownerName\":\"Owner\"}" 2>/dev/null || true
          done
          echo ""
          echo "Security audit complete"
