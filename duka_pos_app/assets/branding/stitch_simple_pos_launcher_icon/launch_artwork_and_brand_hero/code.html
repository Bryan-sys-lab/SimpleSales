<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1376, height=768">
  <title>Simple POS Launch Artwork & Brand Hero</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body, html {
      width: 1376px;
      height: 768px;
      overflow: hidden;
      background-color: #251A1D;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    .canvas {
      position: relative;
      width: 1376px;
      height: 768px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* Subtle radial lift toward #4B1725 behind the mark, blending into #251A1D base */
      background: radial-gradient(circle 600px at 50% 36%, #4B1725 0%, #2b181d 45%, #251A1D 80%, #251A1D 100%);
    }

    .brand-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: -12px;
    }

    /* Brand mark tile: 22% of 768px height = ~168px x 168px */
    .mark-tile {
      width: 168px;
      height: 168px;
      background-color: #251A1D;
      border-radius: 38px; /* 0.227 * 168 = ~38.1px */
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
      position: relative;
      margin-bottom: 34px;
    }

    .mark-svg {
      width: 168px;
      height: 168px;
      display: block;
    }

    /* Wordmark: ~9% of canvas height = ~69px */
    .wordmark {
      font-size: 68px;
      font-weight: 700;
      line-height: 1;
      color: #FFFFFF;
      letter-spacing: 0.08em;
      text-transform: none;
      margin-bottom: 18px;
    }

    /* Supporting text: ~40% of wordmark size = ~27px */
    .tagline {
      font-size: 27px;
      font-weight: 500;
      line-height: 1.3;
      color: #66575B;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="brand-container">
      <!-- Brand mark tile: 22% canvas height -->
      <div class="mark-tile">
        <svg class="mark-svg" viewBox="0 0 512 512" width="168" height="168">
          <!-- Squircle tile background with rx 0.227 (116) -->
          <rect x="0" y="0" width="512" height="512" rx="116" ry="116" fill="#251A1D" />
          
          <!-- Receipt: left 0.335 (171.52), top 0.130 (66.56), right 0.665 (340.48), bottom 0.600 (307.2) -->
          <path d="
            M 183.808 66.56
            L 328.192 66.56
            A 12.288 12.288 0 0 1 340.48 78.848
            L 340.48 307.2
            L 322.048 307.2
            L 300.928 276.48
            L 279.808 307.2
            L 267.328 307.2
            L 256.0 276.48
            L 244.672 307.2
            L 232.192 307.2
            L 211.072 276.48
            L 189.952 307.2
            L 171.52 307.2
            L 171.52 78.848
            A 12.288 12.288 0 0 1 183.808 66.56
            Z" fill="#FFFFFF" />

          <!-- Terminal body: left 0.150 (76.8), top 0.660 (337.92), right 0.850 (435.2), bottom 0.868 (444.416) -->
          <rect x="76.8" y="337.92" width="358.4" height="106.496" rx="23.552" ry="23.552" fill="#FFFFFF" />

          <!-- Terminal screen: left 0.200 (102.4), top 0.660 (337.92), right 0.800 (409.6), bottom 0.790 (404.48) -->
          <rect x="102.4" y="337.92" width="307.2" height="66.56" rx="10.24" ry="10.24" fill="#6E2638" />
        </svg>
      </div>

      <!-- Wordmark -->
      <h1 class="wordmark">Simple POS</h1>

      <!-- Supporting Line -->
      <p class="tagline">Point of sale, built for the till it runs on</p>
    </div>
  </div>
</body>
</html>
