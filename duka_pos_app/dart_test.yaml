concurrency: 1

tags:
  # The real-workbook import test decodes a 3.2 MB, 192-sheet workbook and
  # takes minutes. It is tagged so a quick loop can skip it with
  # `flutter test --exclude-tags slow_import`, and it is NOT excluded in CI:
  # it is the only test that proves the parser reads a file it did not write.
  slow_import:
