name: duka_pos
description: >-
  SimpleSales — an offline-first point of sale for African retail: sales,
  M-Pesa payments, stock and eTIMS receipts that keep working when the internet
  does not.
publish_to: 'none'
# The build number must increase on every release: Android refuses to install a
# build whose code is not higher than the installed one.
#
# 2.0.0+1 — the app was renamed to Simple POS and given a NEW package id
# (com.dukapos.simplepos; the previous id was com.dukapos.duka_pos).
#
# That is a deliberate break, not an oversight. A package id is an app's
# identity: Android treats a different id as a different app, so an existing
# install will NOT be updated in place. The owner has to sideload or install
# this build fresh, which means the local database is not migrated and no data
# carries over automatically — hence a major version rather than a patch.
# It also means the release key and the update checker's identity both need
# to be read as new, so do not expect 1.1.0 devices to see this as an update.
version: 2.0.0+22

environment:
  sdk: '>=3.0.0 <4.0.0'
  # Pinned so a Flutter upgrade is a deliberate act, not something a transitive
  # bump can trigger underneath the design system.
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0

  # Flutter's OWN chrome strings and the ambient TextDirection come from a
  # different catalogue than our ARB. Without these the first Tooltip asserts on
  # an unsupported locale, and `Directionality` stays LTR no matter what the ARB
  # says — which is an app that looks translated and reads backwards.
  flutter_localizations:
    sdk: flutter

  # The one router for the whole app. Every screen is URL-addressable and each
  # tab keeps its own navigation stack via StatefulShellRoute.indexedStack.
  go_router: ^17.5.0

  # Local database (offline-first system of record)
  sqflite: ^2.4.4+1
  path_provider: ^2.1.1
  path: ^1.8.3

  # PIN hashing
  crypto: ^3.0.7
  cryptography: ^2.9.0

  # Local network sync between tills (host/client)
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  multicast_dns: ^0.3.2+6
  http: ^1.6.0

  # Excel / CSV export-import (fully offline path)
  excel: ^4.0.2
  share_plus: ^13.3.0
  file_picker: ^13.1.0

  # Self-hosted Keycloak/OIDC authentication; mobile uses PKCE, no client secret
  flutter_appauth: ^12.1.0
  dio: ^5.4.0

  # Google Sheets live sync (online path)
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  googleapis_auth: ^2.3.4
  extension_google_sign_in_as_googleapis_auth: ^3.0.0

  # State management
  provider: ^6.1.1
  shared_preferences: ^2.5.6

  # Security: per-install random PIN salt, kept in the OS keystore/keychain
  flutter_secure_storage: ^11.2.0

  # Crash reporting (Sentry - no Firebase required)
  # 8.x compiles Kotlin with language version 1.6, which the Kotlin 2.4 compiler
  # this project pins rejects outright ("Language version 1.6 is no longer
  # supported"), failing :sentry_flutter:compileDebugKotlin. 9.x is the line
  # that supports Kotlin 2.x.
  sentry_flutter: ^9.30.1
  
  # Update checker (for sideloaded APKs)
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2

  # Camera barcode scanning. The wedge path (a hardware scanner that types into
  # the till) needs nothing at all — see lib/services/barcode/scan_input_service
  # — so this is only required for a shop that scans with the handset camera.
  # Bluetooth printing is deliberately NOT a package: `bluetooth_printers` is
  # discontinued on pub.dev, so that channel is owned outright in
  # android/app/src/main/kotlin/com/dukapos/simplepos/PrinterChannel.kt behind
  # the PrinterService seam.
  mobile_scanner: ^7.4.2

  # Formatting
  intl: ^0.20.3
  sqflite_common_ffi_web: ^1.2.0
  web_socket_channel: ^3.0.3
  image_picker: ^1.2.4
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Runs sqflite against a real SQLite engine on the test host (no device/emulator needed)
  sqflite_common_ffi: ^2.3.0
  # Mocking for tests
  mockito: ^5.4.4
  build_runner: ^2.16.2
  # A test takes over the documents directory so a backup's target is somewhere
  # it owns. Declared here rather than borrowed transitively through
  # path_provider, because importing a package you do not declare is exactly the
  # dependency-hygiene smell the analyzer is right to flag.
  path_provider_platform_interface: ^2.1.3
  # The keystore seam the backup test drives.  is a
  # direct dependency already, so this is its platform interface, declared for
  # the same reason as the one above.
  flutter_secure_storage_platform_interface: ^2.1.1

flutter:
  uses-material-design: true

  # Runs `flutter gen-l10n` on every build, so a key added to lib/l10n/app_en.arb
  # without a matching reference cannot compile: the generated getter is missing.
  generate: true

  # Plus Jakarta Sans is the brand face named in the launcher artwork
  # (assets/branding/ARTWORK_PROMPT.md). It ships as a VARIABLE font so a single
  # file covers the whole 200-800 weight axis: `FontWeight` drives the `wght`
  # axis directly, which is why no static per-weight duplicates are declared and
  # why `FontVariation('wght', …)` never appears in the theme. Weights used by
  # the design system are 400 (body), 500 (labels), 600 (dense emphasis), 700
  # (titles) and 800 (money).
  #
  # Never `google_fonts` here: the till is offline-first and a runtime font fetch
  # is a network dependency in the one code path that must never need one.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
        - asset: assets/fonts/PlusJakartaSans-Italic-Variable.ttf
          style: italic

  # Brand artwork. `SimplePosMark` renders the mark as vectors (see
  # lib/ui/brand/simple_pos_mark.dart), so these rasters exist for the surfaces
  # that genuinely want a bitmap — the share/export header and the store listing
  # — not for on-screen chrome.
  assets:
    - assets/branding/simple_pos_icon_512.png
    - assets/branding/simple_pos_icon_1024.png
    - assets/branding/simple_pos_foreground_512.png
    - assets/branding/simple_pos_icon_monochrome_512.png
    - assets/branding/stitch_simple_pos_launcher_icon/simple_pos_geometric_s_icon/screen.png
    - assets/branding/stitch_simple_pos_launcher_icon/simple_pos_till_action_s_icon/screen.png
