# The whole stack: the database, the identity provider, the API, and the
# tests that run against it.
#
# ## THE SECRETS COME FROM THE ENVIRONMENT
#
# They are not in this file. A compose file that carries a password is a
# password in git, and this one had placeholder secrets in it that could not
# even be parsed — `[REDACTED]` is a YAML LIST, not a string, and the PayHero
# token contained a `#`, which YAML reads as the start of a comment. So the
# file could not start the stack at all.
#
# Every secret below is REQUIRED and named: a missing one stops the stack with
# a message that says which, rather than starting with a blank password and
# failing somewhere less obvious. Copy `.env.example` to `.env` and the stack
# starts.
#
# ## THE MIGRATIONS RUN BEFORE THE API
#
# The API container applies the migrations and THEN starts. A stack that
# starts the API against an empty database serves 500s for every query, and
# the first symptom is a test that fails for a reason that looks like a bug in
# the test.
services:
  # ------------------------------------------------------------------
  # PostgreSQL - application database
  # ------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: duka_pos_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-duka_pos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-duka_pos}
      # The identity provider's own password, so the first-run script can
      # create its role with it.
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
    volumes:
      - duka_pos_db_data:/var/lib/postgresql/data
      # The first-run setup: the identity provider's own role and database.
      # Keycloak connects to an EXISTING database with a role that can log in —
      # it creates neither — so without this the stack fails with "password
      # authentication failed for user keycloak", which reads like a wrong
      # password and is actually a missing role.
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-duka_pos} -d ${POSTGRES_DB:-duka_pos}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # Keycloak - OIDC identity provider
  # ------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: duka_pos_keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      # The health endpoints, on the management port.
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    # NO HEALTH CHECK, AND THAT IS DELIBERATE.
    #
    # Two things fight here. The image is ubi9-MINIMAL and has no curl, so a
    # check that shells out to curl fails with "executable file not found" and
    # the container is called unhealthy while the server is running perfectly
    # well. And the health endpoints live on the MANAGEMENT port in Keycloak
    # 24, so a check against the main port answers 404.
    #
    # Neither is worth a fight. The init container already waits for
    # Keycloak — by asking it for an admin token, which is the thing the init
    # needs anyway — and its successful completion is the gate the API waits
    # for. So the readiness gate is the one that tests the thing that
    # matters, and there is no health check to get wrong.
    #
    # The API waits for the init container, not for this one.

  # ------------------------------------------------------------------
  # Keycloak init - creates realm, client, and test user
  # ------------------------------------------------------------------
  keycloak-init:
    build:
      context: .
      dockerfile: Dockerfile.keycloak-init
    container_name: duka_pos_keycloak_init
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      REALM_NAME: ${REALM_NAME:-duka}
      CLIENT_ID: ${CLIENT_ID:-duka-app}
      TEST_USER: ${TEST_USER:-test-user}
      TEST_USER_PASSWORD: ${TEST_USER_PASSWORD:?TEST_USER_PASSWORD is required}
      TEST_USER_EMAIL: ${TEST_USER_EMAIL:-test-user@example.com}
    depends_on:
      keycloak:
        # Started, not healthy: Keycloak has no health check (see above), and
        # this container IS the readiness gate — it waits for the server by
        # asking it for an admin token.
        condition: service_started

  # ------------------------------------------------------------------
  # Migrations - its own service, so the API never runs a CLI
  # ------------------------------------------------------------------
  # The schema is applied HERE, once, before the API starts.
  #
  # It used to be applied by the API container, as `prisma migrate deploy &&
  # node dist/index.js`. That put a package-manager's job inside the service's
  # start-up, where it fails in ways that look like the service failing: the
  # Prisma CLI wants to write into node_modules, and the runtime image runs
  # as a user that cannot.
  #
  # As its own service, the CLI runs as the image's own user, the API starts
  # knowing the schema is right, and the two failures are separable: a
  # migration that will not apply is a migration's failure, and not the API's.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: duka_pos_migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-duka_pos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-duka_pos}?schema=public
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  # ------------------------------------------------------------------
  # Backend API - Express + Prisma
  # ------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: duka_pos_backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-duka_pos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-duka_pos}?schema=public
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://keycloak:8080/realms/duka}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-duka-api}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-http://keycloak:8080/realms/duka/protocol/openid-connect/certs}
      PAYHERO_AUTH_TOKEN: "${PAYHERO_AUTH_TOKEN:-}"
      SYSTEM_ADMIN_SUBJECTS: ${SYSTEM_ADMIN_SUBJECTS:-admin-subject}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      APP_VERSION_NAME: ${APP_VERSION_NAME:-2.0.0}
      APP_VERSION_CODE: ${APP_VERSION_CODE:-23}
      APP_DOWNLOAD_URL: ${APP_DOWNLOAD_URL:-}
      APP_UPDATE_REQUIRED: ${APP_UPDATE_REQUIRED:-false}
      APP_RELEASE_NOTES: ${APP_RELEASE_NOTES:-Auto-update manifest}
      # The verify flow's own secrets. Without them /api/auth/* answers 503
      # rather than pretending an account was created.
      EMAIL_VERIFICATION_SECRET: ${EMAIL_VERIFICATION_SECRET:-}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-}
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL:-}
      EMAILJS_SERVICE_ID: ${EMAILJS_SERVICE_ID:-}
      EMAILJS_TEMPLATE_ID: ${EMAILJS_TEMPLATE_ID:-}
      EMAILJS_PUBLIC_KEY: ${EMAILJS_PUBLIC_KEY:-}
      EMAILJS_PRIVATE_KEY: ${EMAILJS_PRIVATE_KEY:-}
      VERIFICATION_DEBUG_CODES: ${VERIFICATION_DEBUG_CODES:-false}
      APP_NAME: ${APP_NAME:-SimpleSales}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
      keycloak-init:
        condition: service_completed_successfully
      # The schema, applied by the migration service. The API starts knowing
      # the database is right, rather than discovering it one query at a time.
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Test runner - vitest integration tests against live stack
  # ------------------------------------------------------------------
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: duka_pos_tests
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://${POSTGRES_USER:-duka_pos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-duka_pos}?schema=public
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://keycloak:8080/realms/duka}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-duka-api}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-http://keycloak:8080/realms/duka/protocol/openid-connect/certs}
      PAYHERO_AUTH_TOKEN: "${PAYHERO_AUTH_TOKEN:-}"
      SYSTEM_ADMIN_SUBJECTS: ${SYSTEM_ADMIN_SUBJECTS:-admin-subject}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      REALM_NAME: ${REALM_NAME:-duka}
      CLIENT_ID: ${CLIENT_ID:-duka-app}
      TEST_USER: ${TEST_USER:-test-user}
      TEST_USER_PASSWORD: ${TEST_USER_PASSWORD:?TEST_USER_PASSWORD is required}
      BACKEND_URL: http://backend:3000/api
    depends_on:
      backend:
        condition: service_healthy
    command: ["npx", "vitest", "run"]

volumes:
  duka_pos_db_data:
